<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050607">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="__BASE__icons/favicon-64.png">
<title>Central | Hunter League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/*
Central da CallNet (admin da Hunter League). Mesma estética do app: preto, ciano, chanfros do brasão.
Feita para o dia a dia: o que fazer hoje, registrar indicação colando o WhatsApp, avançar etapas com um toque, liberar o bônus após a 1ª fatura e pagar os saques.
*/
:root{color-scheme:dark;--bg:#050607;--p1:#0B1013;--p2:#10171B;--ln:#1B252B;--ln2:#26333A;--ink:#EEF2F4;--sil:#BEC5CC;--mut:#7E8A92;--c:#19F7FF;--c2:#AEFCFF;--b:#0079FD;--ok:#4DF0A0;--warn:#FFC857;--bad:#FF6B81;--cut:12px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:radial-gradient(60% 40% at 0 0,rgba(25,247,255,.07),transparent 60%),radial-gradient(50% 40% at 100% 100%,rgba(0,121,253,.07),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:500 15px/1.45 Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:var(--c)}
.ch{clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.bs{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:.01em}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}

/* estrutura: barra lateral no computador, barra de baixo no celular */
.side{position:fixed;left:0;top:0;bottom:0;width:248px;display:flex;flex-direction:column;gap:6px;padding:20px 14px;background:linear-gradient(180deg,#081014,#050708);border-right:1px solid var(--ln);z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 14px}
.brand img{width:44px;height:auto}
.brand b{display:block;font-size:22px;line-height:.95}
.brand small{display:block;color:var(--mut);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.novo{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;margin:4px 0 12px;border:0;background:var(--c);color:#050607;font:900 19px "Big Shoulders Display",Impact,sans-serif;text-transform:uppercase;box-shadow:0 0 24px rgba(25,247,255,.25)}
.novo:active{transform:scale(.97)}
.nv{display:flex;align-items:center;gap:12px;width:100%;height:48px;padding:0 12px;border:0;background:none;color:var(--sil);font-weight:700;font-size:15px;text-align:left;border-left:3px solid transparent}
.nv svg{flex:none;color:var(--mut)}
.nv .ct{margin-left:auto;min-width:22px;height:22px;padding:0 6px;display:grid;place-items:center;background:var(--bad);color:#fff;font-size:12px;font-weight:800;clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
.nv.on{color:#fff;background:linear-gradient(90deg,rgba(25,247,255,.12),transparent);border-left-color:var(--c)}
.nv.on svg{color:var(--c)}
.side .foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--ln)}
.av{display:grid;place-items:center;flex:none;width:38px;height:38px;background:#12232A;color:var(--c2);font-weight:800;font-size:13px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.side .foot b{display:block;font-size:14px}.side .foot small{color:var(--mut);font-size:12px}
.side .foot button{margin-left:auto;border:0;background:none;color:var(--mut);padding:8px}
main{margin-left:248px;padding:28px 32px 60px;max-width:1240px}
main.largo{max-width:none}
.top{display:none}
.bot{display:none}
@media (max-width:900px){
 .side{display:none}
 main{margin:0;padding:calc(72px + var(--st)) 16px calc(96px + var(--sb))}
 .top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:10px;height:calc(60px + var(--st));padding:var(--st) 14px 0;background:rgba(5,6,7,.96);border-bottom:1px solid var(--ln)}
 .top img{width:34px}
 .top b{font-size:22px}
 .top .av{margin-left:auto;border:0}
 .bot{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:calc(68px + var(--sb));padding-bottom:var(--sb);background:#060809;border-top:1px solid var(--ln)}
 .bot button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:68px;border:0;background:none;color:var(--mut);font-size:11.5px;font-weight:700}
 .bot button.on{color:var(--c)}
 .bot button .ct{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 4px;display:grid;place-items:center;background:var(--bad);color:#fff;font-size:10.5px;font-weight:800;border-radius:9px}
 .bot .mais{align-self:center;justify-self:center;width:58px;height:58px;margin-bottom:22px;background:var(--c);color:#050607;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);box-shadow:0 0 20px rgba(25,247,255,.4)}
 .bot .mais span{display:none}
}

/* cabeçalho das telas */
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.hd h1{margin:0;font-size:clamp(40px,6vw,56px);line-height:.9}
.hd p{margin:6px 0 0;color:var(--mut);font-weight:600}
.hd .act{display:flex;gap:8px;flex-wrap:wrap}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border:0;background:var(--c);color:#050607;font-weight:800;font-size:14.5px;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);transition:transform .1s,filter .2s;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.96)}
.btn:hover{filter:brightness(1.08)}
.btn.g{background:#15222A;color:var(--ink)}
.btn.ok{background:var(--ok);color:#03140B}
.btn.bad{background:#3A1520;color:#FFB3C0}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px}
.btn:disabled{opacity:.5;pointer-events:none}
.ico{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--ln2);background:var(--p1);color:var(--sil);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}

/* hoje */
.ola{margin-bottom:26px}
.ola h1{margin:0;font-size:clamp(44px,7vw,64px);line-height:.9}
.ola h1 span{color:var(--c)}
.ola p{margin:8px 0 0;color:var(--mut);font-weight:600}.ola p::first-letter{text-transform:uppercase}
.tarefas{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tf{position:relative;display:flex;flex-direction:column;gap:6px;padding:20px 20px 18px;background:linear-gradient(150deg,var(--p2),var(--p1));border:1px solid var(--ln);overflow:hidden;--a:var(--c)}
.tf::before{content:"";position:absolute;left:0;top:0;width:64px;height:3px;background:var(--a);box-shadow:0 0 14px var(--a)}
.tf::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;background:radial-gradient(closest-side,color-mix(in srgb,var(--a) 18%,transparent),transparent);pointer-events:none}
.tf .n{font-size:58px;line-height:.85;color:var(--a)}
.tf b{font-size:17px}
.tf small{color:var(--mut);font-weight:600;font-size:13.5px;line-height:1.35}
.tf .btn{align-self:flex-start;margin-top:10px;background:var(--a)}
.emdia{display:flex;align-items:center;gap:18px;padding:26px;background:linear-gradient(120deg,rgba(77,240,160,.12),var(--p1));border:1px solid rgba(77,240,160,.3)}
.emdia .ok2{display:grid;place-items:center;flex:none;width:64px;height:64px;background:var(--ok);color:#03140B;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.emdia b{font-size:26px}.emdia p{margin:4px 0 0;color:var(--sil)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}@media (max-width:600px){.g3{grid-template-columns:1fr 1fr}}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:10px}
.tr{padding:18px;background:linear-gradient(150deg,#0E2328,#091317 70%);border:1px solid var(--ln);border-top:3px solid var(--a)}
.tr small{display:block;color:var(--a);font-weight:800;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase}
.tr b{display:block;font-size:clamp(30px,4.4vw,42px);line-height:1;margin:6px 0 4px}
.tr span{color:var(--sil);font-size:13px;font-weight:600}
.escada{margin:2px 0 18px;color:var(--mut);font-size:13px;font-weight:600}
.exp .mes{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 10px;border:1px solid var(--ln2);background:#0A1013;color:var(--mut);font-size:12.5px;font-weight:700}
.exp .mes input{background:transparent;border:0;color:var(--ink);font:inherit;outline:none;color-scheme:dark}
.cls{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.cl{padding:3px 8px;background:#0F1A1E;border:1px solid var(--ln);font-size:12px;color:var(--sil);font-weight:700}.cl i{font-style:normal;color:var(--mut)}
.fat{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:16px;align-items:center;padding:14px 16px;background:var(--p1);border:1px solid var(--ln)}
.fat.pronta{border-left:3px solid #FFC857}.fat .nm{font-weight:800}.fat .sub{color:var(--mut);font-size:12.5px;font-weight:600}.fat .val{font-size:24px}
.fat .qd{text-align:right}.fat .qd b{display:block;font-size:14px}.fat .qd small{color:var(--mut);font-size:12px;font-weight:700}
.lib{background:var(--p1);border:1px solid var(--ln)}.lib summary{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;list-style:none}
.lib summary::-webkit-details-marker{display:none}.lib .nm{display:block;font-weight:800}.lib .sub{display:block;color:var(--mut);font-size:12.5px;font-weight:600}.lib .val{font-size:24px;color:var(--c)}
.lib .li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;padding:10px 16px;border-top:1px solid var(--ln)}
.lib .li small{grid-column:1;color:var(--mut);font-size:12px}.lib .li b{grid-row:1/3;grid-column:2}.lib .li .lk{grid-row:1/3;grid-column:3}
.lk{background:none;border:0;color:var(--mut);font-weight:700;font-size:12.5px;text-decoration:underline;cursor:pointer}.lk:hover{color:var(--bad)}
@media (max-width:900px){.tri{grid-template-columns:1fr;gap:8px}.tr{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;padding:12px 14px}.tr small{grid-column:1}.tr b{grid-column:2;grid-row:1/3;font-size:26px;margin:0}.tr span{grid-column:1;font-size:12px}.fat{grid-template-columns:minmax(0,1fr) auto}.fat .qd{text-align:left}.fat .btn{grid-column:1/-1}.exp{flex-wrap:wrap}.exp .mes{flex:1 1 100%}.exp .btn{flex:1 1 0}.pg .pag input{flex:1 1 100%}.pg .pag .anx,.pg .pag .btn{flex:1 1 0}}
.sec{margin:34px 0 12px;color:var(--mut);font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.st{padding:14px 16px;background:var(--p1);border:1px solid var(--ln)}
.st b{display:block;font-size:34px;line-height:1}
.st span{display:block;margin-top:4px;color:var(--mut);font-size:12.5px;font-weight:600}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--ln2);margin-left:6px}
.tl li{position:relative;padding:8px 0 12px 20px;font-size:14px}
.tl li::before{content:"";position:absolute;left:-7px;top:13px;width:10px;height:10px;background:var(--bg);border:2px solid var(--c);transform:rotate(45deg)}
.tl li small{display:block;color:var(--mut);font-size:12.5px}

/* indicações */
.busca{position:relative;flex:1;min-width:220px;max-width:420px}
.busca input{width:100%;height:46px;padding:0 14px 0 42px;border:1px solid var(--ln2);background:var(--p1);outline:none}
.busca input:focus{border-color:var(--c)}
.busca svg{position:absolute;left:14px;top:13px;color:var(--mut)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px;padding-bottom:2px}
.tabs button{flex:none;display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border:1px solid var(--ln2);background:var(--p1);color:var(--sil);font-weight:700;font-size:14px}
.tabs button i{font-style:normal;min-width:22px;padding:1px 6px;background:#1A262C;color:var(--sil);font-size:12px;text-align:center}
.tabs button[aria-selected=true]{border-color:var(--c);color:#fff;background:rgba(25,247,255,.08)}
.tabs button[aria-selected=true] i{background:var(--c);color:#050607}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.ci{display:flex;flex-direction:column;gap:10px;padding:16px;background:linear-gradient(160deg,var(--p2),var(--p1));border:1px solid var(--ln);animation:entra .3s ease both}
@keyframes entra{from{opacity:0;transform:translateY(6px)}}
.ci .l1{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ci .nm{font-size:17px;font-weight:800;line-height:1.2}
.idade{flex:none;padding:3px 8px;background:#15222A;color:var(--sil);font-size:12px;font-weight:700}
.idade.velha{background:rgba(255,200,87,.15);color:var(--warn)}
.ci .tel{display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none;font-weight:700}
.ci .tel svg{color:var(--ok)}
.ci .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--mut);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;background:#14232A;color:var(--c2);font-size:12.5px;font-weight:700}
.chip.app{background:rgba(50,224,0,.14);color:#7CFF5A}
.chip.pl{background:#1A2026;color:var(--sil)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;font-size:12.5px;font-weight:800}
.pill::before{content:"";width:7px;height:7px;background:currentColor;transform:rotate(45deg)}
.p-Nova{color:var(--c2);background:rgba(174,252,255,.1)}.p-Em{color:#7FD8FF;background:rgba(127,216,255,.1)}.p-Agendado{color:var(--warn);background:rgba(255,200,87,.12)}
/* funil (kanban) */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(222px,1fr);gap:10px;overflow-x:auto;padding-bottom:10px;align-items:start}
.kc{display:flex;flex-direction:column;gap:10px;padding:10px;background:rgba(255,255,255,.02);border:1px solid var(--ln);min-height:160px}
.kc>h3{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 4px 2px;font-size:14px;font-weight:800;letter-spacing:.3px;color:var(--k,var(--sil))}
.kc>h3 i{font-style:normal;min-width:24px;padding:1px 7px;background:var(--k,#1A262C);color:#050607;font-size:12px;text-align:center}
.kc>p.dica{margin:-4px 4px 2px;color:var(--mut);font-size:12.5px;line-height:1.35}
.kc .ci{padding:13px}.kc .ci .nm{font-size:15.5px}.kc .vz{color:var(--mut);font-size:13px;padding:14px 6px;text-align:center}
.ci .acoes .btn.sq{flex:none;width:42px;padding:0}
.kc .ci .chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;white-space:normal;text-align:left}.kc .ci .chip .cod{white-space:nowrap}
.kc .ci .acoes{flex-wrap:wrap}.kc .ci .acoes [data-av],.kc .ci .acoes [data-inst],.kc .ci .acoes [data-fat]{flex:1 1 100%;order:-1}
.pr .alerta7{display:inline-block;margin-top:4px;padding:2px 8px;font-size:12px;font-weight:800;color:#FFB86B;background:rgba(255,159,67,.12)}
.parados{display:flex;flex-direction:column;gap:8px}.parados .pd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:var(--p1);border:1px solid var(--ln);border-left:0}
.parados .pd b{display:block;font-size:15px}.parados .pd small{color:var(--mut);font-size:13px}
.p-Instalado,.p-ativo{color:var(--ok);background:rgba(77,240,160,.12)}.p-Não,.p-Cancelado,.p-bloqueado,.p-desfiliado,.p-recusado{color:var(--bad);background:rgba(255,107,129,.12)}.p-pendente{color:var(--warn);background:rgba(255,200,87,.12)}
.ci .acoes{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.ci .acoes .btn{flex:1}
.vazio{padding:40px 20px;text-align:center;color:var(--mut);background:var(--p1);border:1px dashed var(--ln2)}
.vazio b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

/* parceiros */
.pend{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:24px}
.pc{display:flex;flex-direction:column;gap:8px;padding:16px;background:linear-gradient(150deg,rgba(255,200,87,.1),var(--p1) 60%);border:1px solid rgba(255,200,87,.35)}
.pc .nm{font-weight:800;font-size:17px}
.pc .meta{color:var(--mut);font-size:13px;line-height:1.5}
.pc .acoes{display:flex;gap:8px;margin-top:6px}
.lista{display:grid;gap:8px}
.pr{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:12px 14px;background:var(--p1);border:1px solid var(--ln);text-align:left}
.pr:hover{border-color:var(--ln2);background:var(--p2)}
.pr .av{width:44px;height:44px}
.pr .nm{font-weight:800;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .sub{color:var(--mut);font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .dir{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.pr .nums{color:var(--mut);font-size:12px;font-weight:700;white-space:nowrap}
.pr .nums b{color:var(--ink)}
.cod{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;color:var(--c2);font-size:13px}
.flt{display:flex;gap:6px;flex-wrap:wrap}

/* pagar */
.pagtop{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.pagtop b{font-size:20px;min-width:0;flex:1;text-align:center}
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:22px;background:linear-gradient(125deg,#0E2328,#091317 60%);border:1px solid rgba(25,247,255,.25);margin-bottom:16px}
.hero small{display:block;color:var(--c2);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.hero .v{display:block;font-size:clamp(42px,8vw,60px);line-height:.9;color:var(--c);text-shadow:0 0 24px rgba(25,247,255,.3)}
.hero p{margin:6px 0 0;color:var(--sil);font-weight:600}
.hero .dt{text-align:center;padding-left:18px;border-left:2px dashed rgba(174,252,255,.3)}
.hero .dt b{display:block;font-size:50px;line-height:.85}
.hero .dt span{color:var(--sil);font-weight:800;letter-spacing:.06em}
.bar{height:6px;margin-top:12px;background:#152227}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--c))}
.pg{display:grid;grid-template-columns:minmax(0,1.2fr) auto minmax(0,1.4fr) auto;align-items:center;gap:14px;padding:14px 16px;background:var(--p1);border:1px solid var(--ln);margin-bottom:8px}
.pg .nm{font-weight:800}
.pg .sub{color:var(--mut);font-size:12.5px;font-weight:600}
.pg .val{font-size:28px;line-height:1}
.pix{display:flex;align-items:center;gap:8px;min-width:0;padding:8px 10px;background:#0E161A;border:1px solid var(--ln2)}
.pix span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;font-weight:600}
.pix button{flex:none;border:0;background:#15262D;color:var(--c);font-size:12.5px;font-weight:800;padding:5px 9px}
.pg .pag{display:flex;gap:8px}

 const s = document.createElement('div'); s.className = 'scrim';
 s.innerHTML = `<div class="jan ch" role="dialog" aria-modal="true"><button class="ico x" type="button" data-fecha aria-label="Fechar">${I.x}</button>${html}</div>`;
 $('#jan-root').appendChild(s); janAberta = s;
 requestAnimationFrame(() => s.classList.add('on'));
 s.addEventListener('click', e => { if (e.target === s || e.target.closest('[data-fecha]')) fechaJan(); });
 aoAbrir && aoAbrir(s.querySelector('.jan'));
 const f = s.querySelector('input,textarea,button.btn'); if (f && matchMedia('(min-width:901px)').matches) setTimeout(() => f.focus(), 60);
 return s.querySelector('.jan');
};
const fechaJan = () => { if (!janAberta) return; const s = janAberta; janAberta = null; s.classList.remove('on'); setTimeout(() => s.remove(), 180); };
addEventListener('keydown', e => { if (e.key === 'Escape') fechaJan(); });
const confirma = (titulo, texto, botao, ruim) => new Promise(ok => {
 const j = jan(`<h2 class="bs">${h(titulo)}</h2><p class="sub">${h(texto)}</p><div class="rod"><button class="btn g" type="button" data-fecha>Voltar</button><button class="btn ${ruim ? 'bad' : ''}" type="button" data-sim>${h(botao)}</button></div>`);
 j.querySelector('[data-sim]').addEventListener('click', () => { fechaJan(); ok(true); });
});
const copiar = (t, msg) => { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast(msg || 'Copiado')).catch(() => { prompt('Copie:', t); }); };

/* ---------- navegação ---------- */
let pagina = 'hoje', cache = {};
const navDraw = () => {
 const t = cache.resumo ? cache.resumo.tarefas : {};
 const ct = { indicacoes: t.novas || 0, parceiros: t.pendentes || 0, pagar: (t.saques ? t.saques.n : 0) + (t.faturas || 0) + (t.premios || 0) };
 $('#nav-side').innerHTML = MENU.map(([k, t, ic]) => `<button class="nv${pagina === k ? ' on' : ''}" type="button" data-ir="${k}">${ic}<span>${t}</span>${ct[k] ? `<span class="ct">${ct[k]}</span>` : ''}</button>`).join('');
 const bot = [MENU[0], MENU[1], ['novo', 'Indicação', I.mais2], MENU[2], MENU[3]];
 $('#nav-bot').innerHTML = bot.map(([k, t, ic]) => k === 'novo' ? `<button class="mais" type="button" data-novo aria-label="Nova indicação">${ic}<span>${t}</span></button>` : `<button type="button" data-ir="${k}" class="${pagina === k ? 'on' : ''}">${ic}<span>${k === 'pagar' ? 'Bônus' : t}</span>${ct[k] ? `<span class="ct">${ct[k]}</span>` : ''}</button>`).join('');
 $('#top-t').textContent = (MENU.find(m => m[0] === pagina) || ['', 'Central'])[1];
};
const ir = async (k, extra) => {
 if (k === 'mapa') { if (BOOT.modo === 'real') location.href = 'crm.php'; else toast('O mapa e CRM funciona só na Central de verdade.'); return; }
 pagina = k; navDraw(); scrollTo(0, 0); $('#main').classList.remove('largo');
 if (location.hash !== '#' + k) history.replaceState(null, '', '#' + k);
 await TELAS[k](extra);
 navDraw();
};
document.addEventListener('click', e => {
 const n = e.target.closest('[data-ir]'); if (n) { e.preventDefault(); if (n.dataset.aba) maisAba = n.dataset.aba; ir(n.dataset.ir, n.dataset.extra); return; }
 if (e.target.closest('[data-novo]')) { novaIndicacao(); return; }
 const rl = e.target.closest('[data-rolar]'); if (rl) { const el = document.getElementById(rl.dataset.rolar); if (el) el.scrollIntoView({ behavior:'smooth', block:'start' }); return; }
 if (e.target.closest('[data-sair]')) sair();
});
const sair = async () => { if (DEMO) { toast('Na demonstração não tem login. No sistema de verdade, isto encerra a sessão.'); return; } await api('sair', {}); location.reload(); };

/* ---------- tela: hoje ---------- */
const TELAS = {};
/* painel do dia: rua (visitas), telefone (fila do CRM), QR ao vivo e o funil da operação */
const painelDia = r => {
 const c = r.campo || {}, f = r.funil || [], v = r.ao_vivo || [], g = r.goto;
 const mx = Math.max(1, ...f.map(x => x[1]));
 return `${g && g.alerta ? `<div class="alerta ch"><b>WhatsApp do GoTo sem mensagens ${g.horas == null ? 'desde a conexão' : `há ${g.horas} h`}</b><span>Se o WhatsApp da CallNet recebeu mensagens nesse tempo, a integração pode ter caído. Confira em Mais → GoTo.</span><button class="btn sm" type="button" data-ir="mais" data-aba="goto">Conferir</button></div>` : ''}
 <div class="dia">
  <section class="pn ch" style="--a:#FFB547"><header><small>Na rua hoje</small><b class="bs">${c.visitas || 0} ${c.visitas === 1 ? 'visita' : 'visitas'}</b><span>${c.manha || 0} de manhã · ${c.tarde || 0} à tarde</span></header>
   ${(c.lista || []).length ? `<ul>${c.lista.map(x => `<li><i>${h(x.turno)}</i>${h(x.nome)}<small>${h(x.bairro)}</small></li>`).join('')}</ul>` : '<p class="vz">Nenhuma visita marcada para hoje.</p>'}
   <a class="btn sm" href="crm.php#agenda">Abrir a rota do dia</a></section>
  <section class="pn ch" style="--a:#19F7FF"><header><small>No telefone</small><b class="bs">${(c.retornos || 0) + (c.a_ligar || 0)} para ligar</b><span>${c.retornos || 0} ${c.retornos === 1 ? 'retorno vence' : 'retornos vencem'} hoje · ${c.a_ligar || 0} nunca ligadas</span></header>
   <div class="mini2"><div><b class="bs">${c.ligadas || 0}</b><small>ligadas hoje</small></div><div><b class="bs" style="color:var(--ok)">${c.agendou || 0}</b><small>agendaram</small></div><div><b class="bs">${c.ligadas ? Math.round((c.agendou || 0) / c.ligadas * 100) : 0}%</b><small>conversão</small></div></div>
   <a class="btn sm" href="crm.php#ligar">Abrir a fila de ligação</a></section>
  <section class="pn ch" style="--a:#4DF0A0"><header><small>QR ao vivo</small><b class="bs">${r.stats.leit_hoje} ${r.stats.leit_hoje === 1 ? 'leitura' : 'leituras'} hoje</b><span>quem leu o QR e foi para o WhatsApp</span></header>
   ${v.length ? `<ul class="vivo">${v.map(x => `<li><i>${h(x.em)}</i>${h(x.loja)}<small>${h(x.codigo || '')}</small></li>`).join('')}</ul>` : '<p class="vz">Nenhuma leitura hoje ainda. Aparece aqui na hora.</p>'}
   <a class="btn sm g" href="crm.php">Ver no mapa</a></section>
 </div>
 ${f.length ? `<p class="sec">Funil da operação</p><div class="funil ch">${f.map((x, k) => { const ant = k ? f[k - 1][1] : 0, pc0 = k && ant ? Math.round(x[1] / ant * 100) : null, pc = pc0 != null && pc0 <= 100 ? pc0 : null;
   return `<div class="fl"><span>${h(x[0])}</span><div class="br"><i style="width:${Math.max(2, x[1] / mx * 100)}%"></i></div><b class="bs">${x[1]}</b><small>${pc == null ? '' : pc + '%'}</small></div>`; }).join('')}
   <p class="vz" style="margin:8px 0 0">A % é quantos passaram da etapa de cima para esta. Indicações e instalações contam o mês.</p></div>` : ''}`;
};
let vivoT = null;
TELAS.hoje = async () => {
 clearInterval(vivoT); vivoT = setInterval(async () => { if (pagina !== 'hoje' || document.hidden) return; const r2 = await api('resumo'); if (r2.ao_vivo && JSON.stringify(r2.ao_vivo) !== JSON.stringify((cache.resumo || {}).ao_vivo)) { const novo = r2.ao_vivo[0]; TELAS.hoje(); if (novo) toast(`📍 QR de ${novo.loja} lido agora`); } }, 30000);
 const r = cache.resumo = await api('resumo');
 const t = r.tarefas, hr = new Date().getHours();
 const sauda = hr < 12 ? 'Bom dia' : hr < 18 ? 'Boa tarde' : 'Boa noite';
 const dt = new Date().toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
 const cards = [];
 if (t.pendentes) cards.push(['#FFC857', t.pendentes, t.pendentes === 1 ? 'cadastro para aprovar' : 'cadastros para aprovar', 'Aprove e o parceiro ativa o QR da peça no app.', 'Aprovar', 'parceiros']);
 if (t.novas) cards.push(['#AEFCFF', t.novas, t.novas === 1 ? 'indicação nova' : 'indicações novas', 'Chegaram pelo QR ou pelo app e ainda não foram atendidas.', 'Atender', 'indicacoes']);
 if (t.paradas) cards.push(['#FF6B81', t.paradas, t.paradas === 1 ? 'indicação parada' : 'indicações paradas', 'Há mais de 2 dias sem mudar de etapa. Vale cobrar.', 'Ver', 'indicacoes']);
 if (t.saques && t.saques.n) cards.push(['#4DF0A0', reaisC(t.saques.total), t.saques.n === 1 ? 'saque para pagar' : 'saques para pagar', `${t.saques.n} ${t.saques.n === 1 ? 'parceiro pediu' : 'parceiros pediram'} o bônus no app. Pague pelo PIX e anexe o comprovante.`, 'Pagar', 'pagar']);
 if (t.faturas) cards.push(['#FFC857', t.faturas, t.faturas === 1 ? 'cliente para conferir a fatura' : 'clientes para conferir a fatura', 'Instalados há 25 dias ou mais. Se a 1ª fatura foi paga, libere o bônus.', 'Conferir', 'pagar']);
 if (t.premios) cards.push(['#19F7FF', t.premios, t.premios === 1 ? 'kit ou prêmio para entregar' : 'kits e prêmios para entregar', 'Kit completo sai com 20 contatos e 2 vendas. Prêmio de meta, a partir de 30 dias da validação.', 'Entregar', 'pagar']);
 const par = r.parados || [];
 if (par.length) cards.push(['#FF9F43', par.length, par.length === 1 ? `parceiro sem indicar há ${r.dias_alerta}+ dias` : `parceiros sem indicar há ${r.dias_alerta}+ dias`, 'Mande um recado no WhatsApp para animar. A lista está logo abaixo.', 'Ver lista', '#parados']);
 const s = r.stats;
 $('#main').innerHTML = `<div class="ola"><h1 class="bs">${sauda}, <span>${h(r.me.nome)}</span></h1><p>${h(dt)}</p></div>
  ${cards.length ? `<div class="tarefas">${cards.map(c => `<div class="tf ch" style="--a:${c[0]}"><span class="n bs">${h(c[1])}</span><b>${h(c[2])}</b><small>${h(c[3])}</small><button class="btn sm" type="button" ${c[5][0] === '#' ? `data-rolar="${c[5].slice(1)}"` : `data-ir="${c[5]}"`}>${h(c[4])} ▸</button></div>`).join('')}</div>`
   : `<div class="emdia ch"><span class="ok2">${I.ok}</span><div><b class="bs">Tudo em dia</b><p>Nenhuma tarefa pendente agora. Quando chegar indicação ou cadastro, aparece aqui.</p></div></div>`}
  ${par.length ? `<p class="sec" id="parados">Parceiros parados (${r.dias_alerta}+ dias sem indicar)</p><div class="parados">${par.map(p => `<div class="pd"><div><b>${h(p.nome)} <span class="cod">${h(p.codigo)}</span></b><small>${p.nunca ? `Ainda não indicou ninguém · aprovado há ${p.dias} dias` : `Última indicação há ${p.dias} dias`}</small></div><a class="btn sm" href="https://wa.me/55${h(p.wa_d)}?text=${encodeURIComponent(`Oi, ${p.resp}! Tudo bem? Aqui é da CallNet. Faz uns dias que não chega indicação pelo seu QR. Lembra de mostrar a plaquinha para os clientes e de mandar o seu link para quem precisa de internet. Qualquer dúvida, é só chamar!`)}" target="_blank" rel="noopener">${I.wa}Chamar</a></div>`).join('')}</div>` : ''}
  ${painelDia(r)}
  <p class="sec">Números</p>
  <div class="stats"><div class="st ch"><b class="bs">${s.ind_hoje}</b><span>indicações hoje</span></div><div class="st ch"><b class="bs">${s.ind_mes}</b><span>indicações no mês</span></div><div class="st ch"><b class="bs" style="color:var(--ok)">${s.inst_mes}</b><span>instalações no mês</span></div><div class="st ch"><b class="bs">${s.leit_hoje}</b><span>leituras de QR hoje</span></div><div class="st ch"><b class="bs">${s.ativos}</b><span>parceiros ativos</span></div></div>
  ${r.atividade.length ? `<p class="sec">Últimas ações</p><ul class="tl">${r.atividade.map(a => `<li>${h(a.acao)} <b>${h(a.alvo)}</b><small>${h(a.em)} · ${h(a.quem)}</small></li>`).join('')}</ul>` : ''}`;
};

/* ---------- tela: indicações ---------- */
let indAba = 'funil', indBusca = '';
const PROX = { 'Nova':'Em contato', 'Em contato':'Em negociação', 'Em negociação':'Agendado' };
const ANT = { 'Em contato':'Nova', 'Em negociação':'Em contato', 'Agendado':'Em negociação' };
/* colunas do funil: o parceiro vê a mesma etapa no app dele, com palavras simples */
const COLS = [
 ['Nova', 'Novas', '#AEFCFF', 'Chegaram pelo QR ou pelo app.'],
 ['Em contato', 'Em contato', '#7FD8FF', 'Já falamos com o cliente.'],
 ['Em negociação', 'Em negociação', '#B9A6FF', 'Escolhendo plano e tirando dúvidas.'],
 ['Agendado', 'Agendado', '#FFC857', 'Instalação marcada.'],
 ['inst', 'Instalado', '#4DF0A0', 'Esperando a 1ª fatura.'],
 ['fat', '1ª fatura paga', '#19F7FF', 'Bônus liberado (últimos 60 dias).'],
];
TELAS.indicacoes = async () => {
 const r = await api('indicacoes'); cache.inds = r.itens;
 $('#main').classList.add('largo');
 $('#main').innerHTML = `<div class="hd"><div><h1 class="bs">Indicações</h1><p>Funil de vendas: avance cada cliente de etapa. O parceiro acompanha no app.</p></div><div class="busca">${I.busca}<input id="ind-q" type="search" placeholder="Buscar nome, telefone ou código" value="${h(indBusca)}" autocomplete="off"></div><div class="exp"><button class="btn g sm" type="button" data-exp="indicacoes">${I.baixar}Planilha</button></div></div>
  <div class="tabs" role="tablist" id="ind-tabs"></div><div id="ind-lista"></div>`;
 $('#ind-q').addEventListener('input', e => { indBusca = e.target.value; indDraw(); });
 indDraw();
};
const colDe = i => i.status === 'Instalado' ? (i.fatura ? 'fat' : 'inst') : i.status;
const indDraw = () => {
 const q = indBusca.trim().toLowerCase(), qd = q.replace(/\D/g, '');
 const bate = i => !q || i.nome.toLowerCase().includes(q) || i.parceiro.codigo.toLowerCase().includes(q) || (i.parceiro.nome || '').toLowerCase().includes(q) || (qd.length >= 3 && (i.tel_d || '').includes(qd));
 const todas = cache.inds.filter(bate);
 const fim = todas.filter(i => i.status === 'Não instalado' || i.status === 'Cancelado');
 const funil = todas.filter(i => !fim.includes(i));
 $('#ind-tabs').innerHTML = [['funil', 'Funil', funil.length], ['fim', 'Não deu / cancelados', fim.length]].map(([k, t, n]) => `<button type="button" role="tab" data-aba="${k}" aria-selected="${indAba === k}">${t}<i>${n}</i></button>`).join('');
 if (indAba === 'fim') {
  $('#ind-lista').innerHTML = fim.length ? `<div class="cards">${fim.map(cardInd).join('')}</div>` : `<div class="vazio ch"><b>${q ? 'Nada encontrado' : 'Nenhuma aqui'}</b>${q ? 'Tente outro nome, telefone ou código.' : 'Clientes que não fecharam aparecem aqui.'}</div>`;
  return;
 }
 $('#ind-lista').innerHTML = `<div class="kb">${COLS.map(([k, t, cor, dica]) => {
  const l = funil.filter(i => colDe(i) === k);
  return `<section class="kc" style="--k:${cor}" aria-label="${h(t)}"><h3>${h(t)}<i>${l.length}</i></h3><p class="dica">${h(dica)}</p>${l.length ? l.map(cardInd).join('') : `<div class="vz">${q ? 'Nada encontrado' : 'Vazio'}</div>`}</section>`;
 }).join('')}</div>`;
};
const cardInd = i => {
 const aberta = ABERTAS.includes(i.status), velha = aberta && i.dias >= 2;
 const idade = i.dias === 0 ? 'hoje' : i.dias === 1 ? 'há 1 dia' : `há ${i.dias} dias`;
 const volta = ANT[i.status] ? `<button class="btn sm g sq" type="button" data-volta="${i.id}" aria-label="Voltar para ${h(ANT[i.status])}" title="Voltar para ${h(ANT[i.status])}">◂</button>` : '';
 let acoes = '';
 if (PROX[i.status]) acoes = `${volta}<button class="btn sm" type="button" data-av="${i.id}">${h(PROX[i.status])} ▸</button><button class="btn sm g" type="button" data-nd="${i.id}">Não deu</button>`;
 else if (i.status === 'Agendado') acoes = `${volta}<button class="btn sm ok" type="button" data-inst="${i.id}">✓ Instalou</button><button class="btn sm g" type="button" data-nd="${i.id}">Não deu</button>`;
 else if (i.status === 'Instalado' && !i.fatura && !i.pago && MASTER) acoes = `<button class="btn sm ok" type="button" data-fat="${i.id}">✓ 1ª fatura paga</button><button class="btn sm g" type="button" data-reabrir="${i.id}">Reabrir</button>`;
 else if (!i.pago) acoes = `<button class="btn sm g" type="button" data-reabrir="${i.id}">Reabrir</button>`;
 return `<article class="ci ch" id="ind-${i.id}">
  <div class="l1"><span class="nm">${h(i.nome)}</span>${aberta ? `<span class="idade${velha ? ' velha' : ''}">${idade}</span>` : `<span class="pill ${pclass(i.status)}">${h(i.status)}</span>`}</div>
  ${i.tel || i.cpf ? `<div class="meta">${i.tel ? `<a class="tel" href="https://wa.me/55${h(i.tel_d)}" target="_blank" rel="noopener">${I.wa}${h(i.tel)}</a>` : ''}${i.cpf ? `${i.tel ? ' · ' : ''}CPF ${h(i.cpf)}` : ''}</div>` : ''}
  <div class="meta"><span class="chip"><span class="cod">${h(i.parceiro.codigo)}</span>${h(i.parceiro.nome)}</span>${i.origem === 'app' ? '<span class="chip app">pelo app</span>' : i.origem === 'lista' ? '<span class="chip app">lista do parceiro</span>' : ''}${i.plano ? `<span class="chip pl">${h(i.plano)}</span>` : ''}</div>
  ${i.email || i.cep ? `<div class="meta">${i.email ? h(i.email) : ''}${i.cep ? ` · CEP ${h(i.cep)}, nº ${h(i.num)}` : ''}</div>` : ''}
  ${i.status === 'Instalado' ? `<div class="meta" style="color:var(--ok)">Instalado em ${h(i.inst)}${i.bonus != null ? ` · bônus ${reais(i.bonus)}` : ''} · ${i.saque === 'pago' ? 'bônus pago' : i.saque === 'pedido' ? 'saque pedido' : i.fatura ? `liberado em ${h(i.fatura)}` : 'aguardando 1ª fatura'}</div>` : i.motivo ? `<div class="meta" style="color:var(--bad)">${h(i.motivo)}</div>` : ''}
  <div class="acoes">${acoes}<button class="ico" type="button" data-ed="${i.id}" aria-label="Editar" title="Editar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg></button></div></article>`;
};
const etapa = async (id, dados) => {
 const r = await api('etapa', Object.assign({ id }, dados));
 if (r.erro) return toast(r.erro, true);
 toast(r.msg); const el = $('#ind-' + id); if (el) el.style.opacity = '.35';
 const rr = await api('indicacoes'); cache.inds = rr.itens; indDraw(); atualizaResumo();
};
const naoDeu = i => {
 const j = jan(`<h2 class="bs">Não deu certo</h2><p class="sub">${h(i.nome)}: escolha o motivo. O parceiro vê o motivo no app.</p><div class="opcs">${MOTIVOS.map(m => `<button type="button" data-m="${h(m)}">${h(m)}</button>`).join('')}</div>`);
 j.addEventListener('click', ev => { const b = ev.target.closest('[data-m]'); if (b) { fechaJan(); etapa(i.id, { status:'Não instalado', motivo:b.dataset.m }); } });
};
document.addEventListener('click', e => {
 const aba = e.target.closest('[data-aba]'); if (aba) { indAba = aba.dataset.aba; indDraw(); return; }
 const f = (k) => { const b = e.target.closest(`[data-${k}]`); return b ? cache.inds.find(i => i.id === +b.dataset[k]) : null; };
 let i;
 if ((i = f('av'))) return etapa(i.id, { status: PROX[i.status] });
 if ((i = f('volta'))) return etapa(i.id, { status: ANT[i.status] });
 if ((i = f('fat'))) {
  const j = jan(`<h2 class="bs">1ª fatura paga</h2><p class="sub">${h(i.nome)} · ${h(i.parceiro.codigo)} ${h(i.parceiro.nome)} · instalou ${h(i.inst)}</p>
   <label class="f">Data do pagamento da fatura<input type="date" id="j-fd" max="${hojeISO()}" value="${hojeISO()}"></label>
   <p class="sub" style="margin-top:10px">Libera o bônus para o parceiro pedir o saque no app. Também conta para as metas de prêmio.</p>
   <div class="rod"><button class="btn g" type="button" data-fecha>Voltar</button><button class="btn ok" type="button" id="j-ok">✓ Liberar bônus</button></div>`);
  j.querySelector('#j-ok').addEventListener('click', async () => { const d = j.querySelector('#j-fd').value; fechaJan(); const r = await api('liberar', { id:i.id, data:d }); if (r.erro) return toast(r.erro, true); toast(r.msg); const rr = await api('indicacoes'); cache.inds = rr.itens; indDraw(); atualizaResumo(); });
  return;
 }
 if ((i = f('inst'))) {
  const j = jan(`<h2 class="bs">Instalou</h2><p class="sub">${h(i.nome)} · ${h(i.parceiro.codigo)} ${h(i.parceiro.nome)}</p>
   <label class="f">Data da instalação<input type="date" id="j-dt" max="${hojeISO()}" value="${hojeISO()}"></label>
   <p class="sub" style="margin-top:10px">A casa acende no app do parceiro. O bônus é o valor do plano vendido e é liberado quando o cliente pagar a 1ª fatura.</p>
   <div class="rod"><button class="btn g" type="button" data-fecha>Voltar</button><button class="btn ok" type="button" id="j-ok">✓ Confirmar instalação</button></div>`);
  j.querySelector('#j-ok').addEventListener('click', () => { const d = j.querySelector('#j-dt').value; fechaJan(); etapa(i.id, { status:'Instalado', inst:d }); });
  return;
 }
 if ((i = f('nd'))) {
  return naoDeu(i);
 }
 if ((i = f('reabrir'))) return etapa(i.id, { status:'Agendado' });
 if ((i = f('ed'))) {

const lerMensagem = txt => {
 const out = {};
 const cod = txt.match(/\bHL-(?:UBR-)?(?:[A-Z]{3}-\d{4}|TESTE-\d{2})\b/i); if (cod) out.codigo = cod[0].toUpperCase();
 const semCod = txt.replace(/HL[\s-]?[A-Z]{3}[\s-]?\d{4}/ig, ' ');
 const tel = semCod.match(/(?:\+?55[\s.-]?)?\(?([1-9]\d)\)?[\s.-]?(9?\d{4})[\s.-]?(\d{4})/); if (tel) out.tel = `(${tel[1]}) ${tel[2]}-${tel[3]}`;
 let nome = (txt.match(/\]\s*([^:\n\]]{2,60}):/) || txt.match(/^([A-ZÀ-Ú][\wÀ-ú]+(?:\s[A-ZÀ-Ú][\wÀ-ú]+){0,4}):/m) || txt.match(/(?:meu nome é|me chamo|sou o|sou a)\s+([A-ZÀ-Úa-zà-ú]+(?:\s[A-ZÀ-Úa-zà-ú]+){0,3})/i) || [])[1];
 if (nome && !/\d{4}/.test(nome) && !/^\+?\d/.test(nome.trim())) out.nome = nome.trim();
 const cpf = semCod.match(/\b(\d{3}\.?\d{3}\.?\d{3}-?\d{2})\b/); if (cpf && cpf[1].replace(/\D/g, '').length === 11 && (!tel || !cpf[1].includes(tel[3]))) out.cpf = cpf[1];
 const pl = PLANOS.find(p => txt.toLowerCase().includes(p.toLowerCase()) || (p === '1 Giga' && /1\s?giga/i.test(txt))); if (pl) out.plano = pl;
 return out;
};

 if (bonAba === 'liberados') {

    ${g.itens.map(x => `<div class="li"><span>${h(x.cliente)}</span><small>instalou ${h(x.inst)} · liberado ${h(x.fatura)}</small><b>${reais(x.v)}</b><button class="lk" type="button" data-deslib="${x.id}">desfazer</button></div>`).join('')}</details>`).join('')}</div>

   <div class="pix"><span>${h(g.pix)}</span></div>

document.addEventListener('click', async e => {
 const ab = e.target.closest('[data-bab]'); if (ab) { bonAba = ab.dataset.bab; document.querySelectorAll('#bon-tabs button').forEach(b => b.setAttribute('aria-selected', b === ab)); return bonDraw(); }
 const c = e.target.closest('[data-cp]'); if (c && !c.closest('.jan')) return copiar(c.dataset.cp, 'Chave PIX copiada');
 const lb = e.target.closest('[data-lib]');
 if (lb) {
  const x = cache.bon.faturas.find(f => f.id === +lb.dataset.lib);
  const j = jan(`<h2 class="bs">1ª fatura paga</h2><p class="sub">${h(x.cliente)} · ${h(x.codigo)} ${h(x.parceiro)} · instalou ${h(x.inst)}</p>
   <label class="f">Data do pagamento da fatura<input type="date" id="j-fd" max="${hojeISO()}" value="${hojeISO()}"></label>
   <p class="sub" style="margin-top:10px">Libera ${reais(x.v)} para o parceiro pedir o saque no app. Também conta para as metas de prêmio.</p>
   <div class="rod"><button class="btn g" type="button" data-fecha>Voltar</button><button class="btn ok" type="button" id="j-ok">✓ Liberar bônus</button></div>`);
  j.querySelector('#j-ok').addEventListener('click', async () => { const d = j.querySelector('#j-fd').value; fechaJan(); const r = await api('liberar', { id:x.id, data:d }); if (r.erro) return toast(r.erro, true); toast(r.msg); TELAS.pagar(); atualizaResumo(); });
  return;
 }
 const dl = e.target.closest('[data-deslib]');
 if (dl) { if (!(await confirma('Desfazer liberação', 'O valor volta para "Esperando 1ª fatura" e sai do saldo do parceiro.', 'Desfazer', true))) return; const r = await api('liberar', { id:+dl.dataset.deslib, desfazer:1 }); if (r.erro) return toast(r.erro, true); toast(r.msg); TELAS.pagar(); atualizaResumo(); return; }
 const p = e.target.closest('[data-pagar]');
 if (p) {
  const g = cache.bon.pedidos.find(x => x.id === +p.dataset.pagar), idpix = (document.querySelector(`[data-idpix="${g.id}"]`) || {}).value || '';
  const arq = (document.querySelector(`[data-arq="${g.id}"]`) || {}).files?.[0];
  if (!(await confirma('Confirmar pagamento', `${g.parceiro}: ${reais(g.valor)} no PIX ${g.pix}. ${arq ? 'O comprovante anexado vai junto e' : 'Sem comprovante anexado (dá para anexar depois).'} O parceiro vê tudo no app.`, 'Confirmar'))) return;
  const fd = new FormData(); fd.append('id', g.id); fd.append('pix', idpix); if (arq) fd.append('arquivo', arq);
  const r = await api('pagar_saque', fd); if (r.erro) return toast(r.erro, true); toast(r.msg); TELAS.pagar(); atualizaResumo(); return;
 }
 const en = e.target.closest('[data-ent]');
 if (en) { const r = await api('entregar', { id:+en.dataset.ent }); if (r.erro) return toast(r.erro, true); toast(r.msg); TELAS.pagar(); atualizaResumo(); }
});
document.addEventListener('change', async e => {
 if (e.target.id === 'exp-mes') { expMes = e.target.value || hojeMes(); return; }
 const f = e.target.closest('[data-arq]');
 if (f) { const lb = f.closest('.anx'), arq = f.files[0]; if (arq && arq.size > 5 * 1024 * 1024) { f.value = ''; return toast('Arquivo maior que 5 MB.', true); } lb.classList.toggle('tem', !!arq); lb.querySelector('span').textContent = arq ? arq.name : 'Comprovante'; return; }
 const ax = e.target.closest('[data-anexar]');
 if (ax && ax.files[0]) {
  if (ax.files[0].size > 5 * 1024 * 1024) { ax.value = ''; return toast('Arquivo maior que 5 MB.', true); }
  const fd = new FormData(); fd.append('id', ax.dataset.anexar); fd.append('arquivo', ax.files[0]);
  const r = await api('anexar', fd); if (r.erro) return toast(r.erro, true); toast(r.msg); TELAS.pagar();
 }
});
/* planilhas para a contabilidade (abrem no Excel) */
const csvDemo = (nome, cab, linhas) => {
 const q = v => { v = String(v ?? ''); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
 const txt = '﻿' + [cab, ...linhas].map(l => l.map(q).join(';')).join('\r\n');
 const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type:'text/csv;charset=utf-8' })); a.download = `hunter-league-${nome}.csv`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
};
document.addEventListener('click', async e => {
 const b = e.target.closest('[data-exp]'); if (!b) return;
 const t = b.dataset.exp, comp = t === 'indicacoes' ? '' : expMes;
 if (!DEMO) { location.href = `exportar.php?t=${t}${comp ? '&c=' + comp : ''}`; toast('Baixando a planilha…'); return; }
 if (t === 'indicacoes') { const r = await api('indicacoes'); csvDemo('indicacoes', ['Criada em', 'Cliente', 'Telefone', 'CPF do cliente', 'Plano', 'Etapa', 'Motivo', 'Instalada em', 'Bônus (R$)', 'Código do parceiro', 'Parceiro'], r.itens.map(i => [i.criado, i.nome, i.tel, i.cpf, i.plano, i.status, i.motivo, i.inst, i.bonus != null ? i.bonus.toFixed(2).replace('.', ',') : '', i.parceiro.codigo, i.parceiro.nome])); }
 else if (t === 'pagamentos') { const r = cache.bon || await api('bonus'); csvDemo(`bonus-pagos-${comp}`, ['Pago em', 'Código', 'Parceiro', 'Chave PIX', 'Clientes', 'Bônus (R$)', 'ID do PIX'], r.pagos.map(g => [g.pago_em, g.codigo, g.parceiro, g.pix, g.n, g.valor.toFixed(2).replace('.', ','), g.pix_id])); }
 else { const r = cache.bon || await api('bonus'); csvDemo(`instalacoes-${comp}`, ['Cliente', 'Código', 'Parceiro', 'Instalada em', 'Bônus (R$)', 'Situação'], [...r.faturas.map(x => [x.cliente, x.codigo, x.parceiro, x.inst, x.v.toFixed(2).replace('.', ','), 'Aguardando 1ª fatura']), ...r.liberados.map(x => [x.cliente, x.codigo, x.parceiro, x.inst, x.v.toFixed(2).replace('.', ','), 'Liberado'])]); }
 toast('Planilha baixada (dados de exemplo)');
});

   <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" type="submit">Salvar</button><button class="btn g" type="button" id="m-teste">Enviar teste</button></div>
   <p class="sub" style="margin:0">${c.smtp_tem_senha && c.smtp_usuario ? '✓ Recuperação por e-mail ativa.' : 'Enquanto não estiver configurado, o "Esqueci a senha" manda o parceiro para o WhatsApp.'}</p></form>`;
  $('#f-mail').addEventListener('submit', async e => { e.preventDefault(); const rr = await api('email', Object.fromEntries(new FormData(e.target))); rr.erro ? toast(rr.erro, true) : (toast(rr.msg), TELAS.mais()); });
  $('#m-teste').addEventListener('click', async () => { toast('Enviando…'); const rr = await api('email', { o:'teste' }); rr.erro ? toast(rr.erro, true) : toast(rr.msg); });
 }
 if (maisAba === 'goto') {
  const g = await api('goto', { o:'status' });
  if (g.erro) { box.innerHTML = `<p class="sub">${h(g.erro)}</p>`; return; }
  box.innerHTML = `<form class="form ch" id="f-goto" style="max-width:620px">
   <p class="sub" style="margin:0">Liga o WhatsApp da CallNet (GoTo) ao Hunter League. Quem ler o QR e mandar <b>"Código do parceiro: HL-…"</b> vira indicação daquele parceiro na hora, e cartões de contato mandados do WhatsApp do parceiro viram a lista dos 20 dele. A conversa aparece na ficha do CRM.</p>
   <div class="ch" style="padding:12px;border:1px solid ${g.ok ? 'var(--ok,#19F7FF)' : 'var(--ln,#333)'}">
    ${g.ok ? `<b>✓ Conectado</b> desde ${h(g.ok.em)}${g.ok.quem ? ' por ' + h(g.ok.quem) : ''}<br><span class="sub">${g.n} mensagem(ns) recebida(s)${g.ultimo ? ' · última às ' + h(g.ultimo) : ' · nenhuma chegou ainda'}</span>` : '<b>Desconectado</b>'}
    ${g.erro ? `<p style="color:#FF5C7A;margin:8px 0 0">${h(g.erro)}</p>` : ''}
   </div>
   <label class="f">ID do cliente (Client ID)<input name="cid" autocomplete="off" spellcheck="false" value="${h(g.cid)}" placeholder="cole o Client ID"></label>
   <label class="f">Segredo do cliente (Client secret)<input name="sec" type="password" autocomplete="new-password" spellcheck="false" placeholder="${g.tem_sec ? '•••••••• salvo (deixe vazio para manter)' : 'cole o segredo aqui'}"></label>
   <label class="f">Conta GoTo (accountKey, opcional)<input name="conta" inputmode="numeric" value="${h(g.conta)}" placeholder="em branco: descobre sozinho"></label>
   <p class="sub" style="margin:0">No developer.goto.com, o cliente precisa ter este endereço de retorno:<br><code style="user-select:all">${h(g.retorno)}</code><br>Quem clicar em Conectar entra com o login de <b>Super Admin</b> do GoTo.</p>
   ${g.conflito || g.assumir ? `<label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" name="assumir" value="1" ${g.assumir ? 'checked' : ''}><span><b>Trazer o WhatsApp para o Hunter League.</b> Outra integração (o painel do contratenio) já recebe as mensagens desta conta. Marcando, o contratenio deixa de receber.</span></label>` : ''}
   <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" type="submit">${g.ok ? 'Reconectar' : 'Conectar'}</button><button class="btn g" type="button" id="gt-s">Só salvar</button>${g.ok ? '<button class="btn g" type="button" id="gt-x">Desligar</button>' : ''}</div>
  </form>
  ${g.msgs.length ? `<h3 style="margin:22px 0 8px">Últimas mensagens</h3><ul class="hist">${g.msgs.map(m => `<li class="ch"><span>${h(m.em)}</span><span>${m.dir === 'in' ? '⬅ ' : '➡ '}${h(m.perfil || m.tel)}</span><div>${h(m.texto)}</div></li>`).join('')}</ul>` : ''}`;
  const dados = (o) => { const f = Object.fromEntries(new FormData($('#f-goto'))); f.o = o; f.assumir = f.assumir ? '1' : ''; return f; };
  $('#f-goto').addEventListener('submit', async e => { e.preventDefault(); const rr = await api('goto', dados('conectar')); if (rr.erro) return toast(rr.erro, true); location.href = rr.url; });
  $('#gt-s').addEventListener('click', async () => { const rr = await api('goto', dados('salvar')); rr.erro ? toast(rr.erro, true) : (toast(rr.msg), TELAS.mais()); });
  const x = $('#gt-x'); if (x) x.addEventListener('click', async () => { if (!confirm('Desligar? As mensagens do WhatsApp param de entrar no Hunter League.')) return; const rr = await api('goto', { o:'desligar' }); rr.erro ? toast(rr.erro, true) : (toast(rr.msg), TELAS.mais()); });
 }
 if (maisAba === 'integra') {
  box.innerHTML = `<form class="form ch" id="f-cdd" style="max-width:560px">
   <p class="sub" style="margin:0">Casa dos Dados: puxa as empresas para o mapa de conquista. O token fica só no servidor e não aparece de novo depois de salvo.</p>
   <label class="f">Token da API (Casa dos Dados)<input name="casadosdados_key" type="password" autocomplete="off" spellcheck="false" placeholder="${c.cdd_fim ? '•••• ' + h(c.cdd_fim) + ' salvo (cole outro para trocar)' : 'cole o token aqui'}"></label>
   <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" type="submit">Salvar</button><button class="btn g" type="button" id="cdd-t">Testar conexão</button>${c.cdd_fim && !c.cdd_no_arquivo ? '<button class="btn g" type="button" id="cdd-x">Apagar token</button>' : ''}</div>
   <p class="sub" style="margin:0">${c.cdd_fim ? '✓ Token configurado' + (c.cdd_no_arquivo ? ' no arquivo do servidor.' : '.') : 'Pegue o token em portal.casadosdados.com.br → Plataforma → API → Chave.'}</p></form>`;
  $('#f-cdd').addEventListener('submit', async e => { e.preventDefault(); const rr = await api('integracoes', Object.fromEntries(new FormData(e.target))); rr.erro ? toast(rr.erro, true) : (toast(rr.msg), TELAS.mais()); });
  $('#cdd-t').addEventListener('click', async () => { toast('Testando…'); const rr = await api('integracoes', { o:'testar' }); rr.ok ? toast(rr.msg) : toast(rr.msg || rr.erro, true); });
  const x = $('#cdd-x'); if (x) x.addEventListener('click', async () => { const rr = await api('integracoes', { o:'apagar' }); rr.erro ? toast(rr.erro, true) : (toast(rr.msg), TELAS.mais()); });
 }
 if (maisAba === 'zerar') {
  const z = await api('zerar', { o:'previa' });
  if (z.erro) { box.innerHTML = `<p class="sub">${h(z.erro)}</p>`; return; }
  const p = z.previa, li = (t) => `<li>${t}</li>`;
  box.innerHTML = `<form class="form ch" id="f-zr" style="max-width:640px">
   <p class="sub" style="margin:0">Para começar a produção limpa. <b>Não tem volta.</b></p>
   <div><b style="color:#FF5C7A">Sai</b><ul style="margin:6px 0 0 18px;padding:0">
    ${li(`${p.parceiros} parceiro(s), com ${p.indicacoes} indicação(ões), ${p.leituras} leitura(s) do QR, ${p.saques} saque(s) e ${p.premios} prêmio(s)`)}
    ${li(p.usuarios.length ? `Usuários da Central: ${p.usuarios.map(h).join(', ')}` : 'Nenhum outro usuário da Central')}
    ${li(p.qr_ativos.length ? `Os QR ativados voltam a ficar livres: ${p.qr_ativos.map(h).join(', ')}` : 'Nenhum QR ativado')}
    ${li(`${p.lojas_ligadas} loja(s) do CRM ligada(s) a parceiros de teste voltam para "a ligar"`)}</ul></div>
   <div><b style="color:var(--nio,#19F7FF)">Fica</b><ul style="margin:6px 0 0 18px;padding:0">${li('Sua conta: ' + h(p.fica))}${li('Configurações (WhatsApp, bônus, mensagem, e-mail) e os códigos dos QR')}${li(`A base do CRM: ${p.empresas} empresa(s), mapa e regiões`)}</ul></div>
   <label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" name="crm" value="1"><span>Também limpar o trabalho do CRM feito nos testes: ${p.crm_trabalhadas} empresa(s) com parecer, agendamento ou tentativa, e ${p.crm_hist} anotação(ões) do histórico. Todas voltam para "a ligar".</span></label>
   <label class="f">Digite ZERAR para confirmar<input name="confirma" autocomplete="off" spellcheck="false"></label>
   <button class="btn" type="submit" style="justify-self:start;background:#FF5C7A">Zerar agora</button></form>`;
  $('#f-zr').addEventListener('submit', async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); f.o = 'zerar'; f.crm = f.crm ? '1' : '';
   if (f.confirma !== 'ZERAR') return toast('Digite ZERAR para confirmar.', true);
   const rr = await api('zerar', f); rr.erro ? toast(rr.erro, true) : (toast(rr.msg), cache = {}, TELAS.mais()); });
 }
 if (maisAba === 'hist') box.innerHTML = `<ul class="hist">${r.historico.map(x => `<li class="ch"><span>${h(x.em)}</span><span>${h(x.quem)}</span><div><b>${h(x.acao)}</b> ${h(x.alvo)}${x.detalhe ? ` <span>· ${h(x.detalhe)}</span>` : ''}</div></li>`).join('')}</ul>`;
 if (maisAba === 'senha') {
  box.innerHTML = `<form class="form ch" id="f-pw" style="max-width:440px"><label class="f">Senha atual<input name="atual" type="password" required></label><label class="f">Senha nova (10 ou mais)<input name="nova" type="password" minlength="10" required></label><button class="btn" type="submit" style="justify-self:start">Trocar senha</button></form>`;
  $('#f-pw').addEventListener('submit', async e => { e.preventDefault(); const rr = await api('minha_senha', Object.fromEntries(new FormData(e.target))); rr.erro ? toast(rr.erro, true) : (toast(rr.msg), e.target.reset()); });
 }
};
document.addEventListener('click', async e => {
 const a = e.target.closest('[data-ma]'); if (a) { maisAba = a.dataset.ma; return TELAS.mais(); }
 const u = e.target.closest('[data-ut]'); if (u) { const r = await api('equipe', { id:+u.dataset.ut }); r.erro ? toast(r.erro, true) : toast(r.msg); TELAS.mais(); }
});

/* ---------- começo ---------- */
$('#me-n').textContent = BOOT.nome; $('#me-p').textContent = BOOT.papel === 'master' ? 'Master' : 'Atendimento';
$('#me-av').textContent = $('#me-av2').textContent = iniciais(BOOT.nome);
const inicio = (location.hash || '#hoje').slice(1);
(async () => { await atualizaResumo(); ir(TELAS[inicio] ? inicio : 'hoje'); })();
if (DEMO) { document.body.classList.add('ehdemo'); $('#demo-bar').hidden = false; $('#demo-reset').addEventListener('click', e => { e.preventDefault(); DEMO_RESET(); cache = {}; ir('hoje'); toast('Demonstração recomeçada.'); }); }
}
</script>
</body>
</html>
