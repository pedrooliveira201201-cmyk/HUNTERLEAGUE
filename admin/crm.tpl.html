<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050607">
<title>Conquista Araguari · CRM Hunter League</title>
<link rel="icon" href="../icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{color-scheme:dark;--bg:#050607;--panel:#0B1013;--p2:#0F171B;--edge:#1E2A30;--ink:#EEF2F4;--mute:#8A959C;--cyan:#19F7FF;--nio:#32E000;--amb:#FFB547;--azul:#5B8CFF;--ouro:#FFD84D;--red:#FF5C7A;--cinza:#6B777D}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 Montserrat,system-ui,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:12px;padding:10px 14px calc(10px) max(14px,env(safe-area-inset-left));border-bottom:1px solid var(--edge);background:#07090A;flex-wrap:wrap}
.top a.vol{color:var(--mute);text-decoration:none;font-weight:700;font-size:14px}
.top h1{margin:0;font:900 26px/1 "Big Shoulders Display",Impact,sans-serif;text-transform:uppercase;letter-spacing:.01em}
.top h1 span{color:var(--cyan)}
.abas{display:flex;gap:4px;margin-left:8px}
.abas button{min-height:38px;padding:6px 14px;border:1px solid var(--edge);background:var(--panel);color:var(--mute);font-weight:800;font-size:14px;cursor:pointer}
.abas button[aria-selected=true]{background:var(--cyan);color:#050607;border-color:var(--cyan)}
.placar{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.placar div{padding:4px 10px;background:var(--panel);border:1px solid var(--edge);text-align:center;min-width:76px}
.placar b{display:block;font:900 20px/1.05 "Big Shoulders Display",Impact,sans-serif}
.placar small{color:var(--mute);font-size:11px;font-weight:700}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 420px;height:calc(100vh - 62px);height:calc(100dvh - 62px)}
#map{position:relative;background:#06090B}
.leaflet-container{background:#06090B;font:600 13px Montserrat,sans-serif}
/* OpenStreetMap escurecido para combinar com o app */
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.78) contrast(.92) saturate(.35)}
.leaflet-control-attribution{background:rgba(5,6,7,.75)!important;color:#8A959C!important}.leaflet-control-attribution a{color:#8A959C!important}
.leaflet-bar a{background:#0B1013!important;color:#EEF2F4!important;border-color:#1E2A30!important}
.ferr{position:absolute;z-index:500;left:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 70px)}
.ferr button,.ferr select,.ferr input{min-height:36px;padding:5px 11px;border:1px solid var(--edge);background:rgba(11,16,19,.92);color:var(--mute);font-weight:700;font-size:13px;cursor:pointer}
.ferr input{cursor:text;width:170px;color:var(--ink)}
.ferr button[aria-pressed=true]{color:var(--ink);border-color:var(--cyan)}
.ferr .des[aria-pressed=true]{background:var(--amb);color:#050607;border-color:var(--amb)}
.segp{position:absolute;z-index:520;left:10px;top:56px;width:min(440px,calc(100% - 20px));max-height:60%;overflow:auto;padding:12px;background:rgba(11,16,19,.97);border:1px solid var(--edge)}
.segp .chips button{text-align:left}
.seglist{list-style:none;margin:10px 0 0;padding:0;max-height:min(46vh,380px);overflow:auto;border-top:1px solid var(--edge)}
.seglist li{border-bottom:1px solid var(--edge)}
.seglist label{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:9px 4px;cursor:pointer;font-size:14px}
.seglist input{width:18px;height:18px;accent-color:var(--cyan)}
.seglist b{color:var(--cyan)}
.segp .chips b{margin-left:6px;color:var(--cyan)}
.segp .chips button[aria-pressed=true] b{color:#050607}
.leg{position:absolute;z-index:500;left:10px;bottom:22px;display:flex;flex-wrap:wrap;gap:4px 12px;max-width:calc(100% - 20px);padding:7px 11px;background:rgba(11,16,19,.92);border:1px solid var(--edge);font-size:12px;font-weight:700}
.leg button{border:0;background:none;padding:2px 0;color:var(--ink);font-weight:700;font-size:12px;cursor:pointer;opacity:.95}
.leg button[aria-pressed=false]{opacity:.35;text-decoration:line-through}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.clu{display:grid;place-items:center;border-radius:50%;background:rgba(5,6,7,.88);border:2px solid var(--c,#19F7FF);color:#fff;font:900 16px/1 "Big Shoulders Display",Impact,sans-serif;box-shadow:0 0 14px rgba(25,247,255,.25);cursor:pointer}
.bolha{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:rgba(5,6,7,.86);border:2px solid var(--c,#19F7FF);color:#fff;text-align:center;box-shadow:0 0 18px rgba(25,247,255,.25);cursor:pointer}
.bolha b{font:900 22px/1 "Big Shoulders Display",Impact,sans-serif}
.bolha small{display:block;font-size:9.5px;font-weight:800;color:#cfe;max-width:60px;line-height:1.1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lado{background:var(--panel);border-left:1px solid var(--edge);overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.lado h2{margin:0 0 2px;font:900 25px/1.05 "Big Shoulders Display",Impact,sans-serif;text-transform:uppercase}
.sub{color:var(--mute);font-size:13.5px}
.sec{margin:18px 0 6px;font-size:12px;font-weight:800;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.tag{display:inline-block;padding:3px 9px;font-size:12px;font-weight:800;color:#050607}
.lin{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--edge);font-size:14px}
.lin span:first-child{color:var(--mute)}
.lin span:last-child{text-align:right;overflow-wrap:anywhere}
.bt,.abas button,.ferr button,.chips button,.placar div{clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.bt.go,.bt.ok,.bt.am{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;font-size:19px;text-transform:uppercase;letter-spacing:.02em}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 14px;border:1px solid var(--edge);background:var(--p2);color:var(--ink);font-weight:800;font-size:14px;cursor:pointer;text-decoration:none;text-align:center}
.bt.go{background:var(--cyan);color:#050607;border-color:var(--cyan)}
.bt.ok{background:var(--nio);color:#050607;border-color:var(--nio)}
.bt.am{background:var(--amb);color:#050607;border-color:var(--amb)}
.bt.rd{border-color:#5A2A35;color:#FFB3C1}
.bt:disabled{opacity:.5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.big{font:900 22px "Big Shoulders Display",Impact,sans-serif;text-transform:uppercase;min-height:56px}
.box{margin-top:12px;padding:12px;background:#0A1215;border:1px solid var(--edge)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:36px;padding:5px 11px;border:1px solid var(--edge);background:var(--p2);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--cyan);color:#050607;border-color:var(--cyan)}
label.f{display:block;margin-top:8px;font-size:13px;font-weight:700;color:var(--mute)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--edge);background:#070B0D;color:var(--ink);font-size:16px}
textarea{min-height:70px;resize:vertical}
.lista{list-style:none;margin:8px 0 0;padding:0}
.lista li{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:9px 6px;border-top:1px solid var(--edge);cursor:pointer}
.lista li:hover,.lista li:focus-visible{background:#0F1A1E;outline:none}
.lista li i{width:10px;height:10px;border-radius:50%}
.lista li small{display:block;color:var(--mute);font-size:12px}
.lista li em{font-style:normal;font-size:11.5px;font-weight:800;color:var(--amb);white-space:nowrap}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:7px 0;border-top:1px solid var(--edge);font-size:13.5px}
.hist li span{display:block;color:var(--mute);font-size:12px}
.barra{height:10px;background:#16222A;margin-top:6px}.barra i{display:block;height:100%;background:var(--cyan);transition:width .4s}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
table.t td,table.t th{border-top:1px solid var(--edge);padding:5px 4px;text-align:left;vertical-align:top}
.tour{position:fixed;inset:0;z-index:3000;pointer-events:none}
.tour-luz{position:fixed;border:3px solid var(--cyan);box-shadow:0 0 0 9999px rgba(0,0,0,.6),0 0 28px rgba(25,247,255,.45);pointer-events:none;transition:left .25s,top .25s,width .25s,height .25s}
.tour-c{position:fixed;z-index:3002;pointer-events:auto;width:min(360px,calc(100vw - 16px));padding:18px;background:#0B1013;border:2px solid var(--cyan);box-shadow:0 18px 50px rgba(0,0,0,.75)}
.tour-c .n{font:900 14px Montserrat,sans-serif;color:var(--cyan)}
.tour-c h3{margin:4px 0 6px;font:900 26px/1.05 "Big Shoulders Display",Impact,sans-serif;text-transform:uppercase}
.tour-c p{margin:0;color:#C9D1D6}
.tour-c .pts{display:flex;gap:6px;margin-top:14px}.tour-c .pts i{flex:1;height:5px;background:#1E2A30}.tour-c .pts i.on{background:var(--cyan)}
.tour-c .pular{margin-top:10px;border:0;background:none;color:var(--mute);font-weight:700;cursor:pointer;padding:6px 0}
.busca{position:relative}
.sug{position:absolute;left:0;top:calc(100% + 4px);z-index:600;width:min(320px,80vw);margin:0;padding:4px 0;list-style:none;background:#0B1013;border:1px solid var(--cyan);box-shadow:0 12px 30px rgba(0,0,0,.6)}
.sug li{padding:10px 12px;cursor:pointer;font-size:14px}.sug li small{display:block;color:var(--mute);font-size:12px}.sug li:hover,.sug li[aria-selected=true]{background:#0F1A1E}
.fx{display:contents}.so-cel{display:none}
.b-leg{position:absolute;z-index:510;left:10px;bottom:22px;min-height:36px;padding:6px 12px;border:1px solid var(--edge);background:rgba(11,16,19,.92);color:var(--ink);font-weight:800;font-size:13px;cursor:pointer;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.b-leg[aria-expanded=true]{bottom:auto;top:auto}
.leg{bottom:64px!important}
.alca{display:none}
.leg[hidden],.segp[hidden],.sug[hidden],.fx[hidden]{display:none!important}
.placar small{white-space:nowrap}
.sk{display:block;height:14px;margin:10px 0;background:linear-gradient(90deg,#121A1E 25%,#1B272C 50%,#121A1E 75%);background-size:200% 100%;animation:sk 1.2s infinite linear}
.sk.t{height:28px;width:70%}.sk.b{height:52px}.sk.s{width:45%}
@keyframes sk{to{background-position:-200% 0}}
.vazio2{padding:22px 6px;text-align:center;color:var(--mute)}.vazio2 b{display:block;color:var(--ink);font:900 22px "Big Shoulders Display",Impact,sans-serif;text-transform:uppercase;margin-bottom:4px}
.pulso{width:70px;height:70px;border-radius:50%;border:3px solid #32E000;animation:puls 1.4s ease-out 4;pointer-events:none}
@keyframes puls{from{transform:scale(.2);opacity:1}to{transform:scale(1.4);opacity:0}}
.med{display:inline-block;margin-left:6px;padding:1px 7px;font-size:11px;font-weight:900;color:#050607;border-radius:9px}
.med.m1{background:#D9925B}.med.m2{background:#C8D3DA}.med.m3{background:#FFD84D}
.bolha .pct{display:block;font-size:10px;font-weight:900;color:var(--c)}
.toast .acao{margin-left:14px;padding:6px 12px;border:1px solid var(--cyan);background:var(--cyan);color:#050607;font-weight:900;cursor:pointer}
.rota{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--edge)}
.rota .n{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--amb);color:#050607;font-weight:900}
.rota .acs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.rota .acs .bt{min-height:38px;padding:6px 10px;font-size:13px}
@media(max-width:900px){
 body{overflow:hidden}
 .top{padding:8px 10px;gap:6px 10px}
 .top h1{font-size:21px}.top a.vol{font-size:13px}
 .abas{order:3;width:100%;margin:0;overflow-x:auto}.abas button{flex:1;min-height:40px;padding:6px 8px}
 .placar{order:4;width:100%;margin:0;flex-wrap:nowrap;overflow-x:auto;gap:4px}.placar div{min-width:0;flex:none;padding:3px 13px 5px}.placar b{font-size:17px}.placar small{font-size:10.5px}
 #b-tour{position:absolute;right:10px;top:8px}
 .wrap{display:block;height:calc(100dvh - var(--topo,150px))}
 #map{height:100%}
 .lado{position:fixed;left:0;right:0;bottom:0;z-index:900;height:var(--fh,46dvh);max-height:calc(100dvh - var(--topo,150px));border:0;border-top:2px solid var(--cyan);border-radius:16px 16px 0 0;padding:0 14px calc(18px + env(safe-area-inset-bottom));transition:height .25s ease;box-shadow:0 -14px 30px rgba(0,0,0,.55)}
 .lado.f0{--fh:84px}.lado.f1{--fh:46dvh}.lado.f2{--fh:calc(100dvh - var(--topo,150px))}
 .lado.arrasta{transition:none}
 .alca{display:block;position:sticky;top:0;z-index:2;width:100%;height:30px;margin:0 0 4px;border:0;background:var(--panel);cursor:grab;touch-action:none}
 .alca i{display:block;width:48px;height:5px;margin:0 auto;border-radius:3px;background:#3A4A52}
 .so-cel{display:inline-flex}
 .fx{display:none}.fx.on{display:flex;flex-wrap:wrap;gap:6px;width:100%}
 .ferr{max-width:calc(100% - 64px)}.ferr input{width:150px}
 .b-leg{bottom:calc(var(--fh,46dvh) + 10px)}
 .leg{bottom:calc(var(--fh,46dvh) + 54px)!important}
 .bt{min-height:46px}
 .g2 .bt.big{min-height:54px}
}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2000;max-width:min(92vw,520px);padding:12px 18px;background:#0E2A2E;border:1px solid var(--cyan);font-weight:700;display:none}
.toast.on{display:block}.toast.err{background:#2A0E15;border-color:var(--red)}
details summary{cursor:pointer;font-weight:800;color:var(--mute);margin-top:16px}
.vazio{padding:20px 4px;color:var(--mute)}
.ajuda{margin-top:8px;padding:10px 12px;border-left:3px solid var(--amb);background:#1A140A;font-size:13.5px}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.leaflet-tooltip{background:#0B1013;color:#EEF2F4;border:1px solid #1E2A30;font-weight:700}
.leaflet-tooltip-top:before{border-top-color:#1E2A30}
@media(max-width:900px){body{overflow:auto}.wrap{grid-template-columns:1fr;height:auto}#map{height:62vh}.lado{border-left:0;border-top:1px solid var(--edge)}.placar{margin-left:0;width:100%}.placar div{flex:1;min-width:0}.abas{margin-left:0}}
.zap{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto;padding:8px;background:#070B0D;border:1px solid var(--edge)}
.bal{max-width:85%;padding:8px 10px;font-size:14px;white-space:pre-wrap;word-break:break-word;border:1px solid var(--edge)}.bal span{display:block;font-size:11px;opacity:.6;margin-top:3px}
.bal.in{align-self:flex-start;background:#0E1519}.bal.out{align-self:flex-end;background:#0A2A2C;border-color:#19F7FF55}

/* ===== visual 2 (27/11): mapa de conquista ===== */
.leaflet-tile-pane{filter:invert(1) hue-rotate(195deg) brightness(.82) contrast(.92) saturate(.42)}
#map::after{content:"";position:absolute;inset:0;z-index:450;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(2,4,6,.55) 100%)}
.top{background:linear-gradient(180deg,#0A0F12,#06090B);box-shadow:0 1px 0 #142026,0 8px 24px rgba(0,0,0,.35);position:relative;z-index:1000}
.placar div{position:relative;background:linear-gradient(180deg,#0E161A,#0A1013);border-color:#1A262C}
.placar div::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--c,#2A3A42)}
.placar div b{color:var(--c,var(--ink))}
.ferr{gap:6px}
.ferr button,.ferr input{background:rgba(9,14,17,.78);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-color:rgba(60,82,92,.55);color:#C9D3D8;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.ferr button:hover{color:#fff;border-color:#3A5560}
.ferr input::placeholder{color:#76848B}
.chips-et{position:absolute;z-index:500;left:10px;top:54px;right:64px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips-et::-webkit-scrollbar{display:none}
.chips-et button{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:4px 11px 4px 9px;border:1px solid rgba(60,82,92,.55);border-radius:16px;background:rgba(9,14,17,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#DDE5E9;font-weight:700;font-size:12.5px;cursor:pointer;transition:opacity .15s,border-color .15s}
.chips-et button i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.chips-et button b{font-weight:800;color:var(--c);font-size:12px}
.chips-et button[aria-pressed=false]{opacity:.4}.chips-et button[aria-pressed=false] i{box-shadow:none}
.chips-et button[aria-pressed=true]{border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.camp{position:absolute;z-index:620;right:10px;top:54px;width:min(300px,calc(100% - 20px));padding:12px 14px;background:rgba(9,14,17,.95);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid #22323A;box-shadow:0 18px 40px rgba(0,0,0,.55)}
.camp label{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid #16232A;cursor:pointer;font-weight:700;font-size:14px}
.camp label:first-of-type{margin-top:8px}
.camp input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--cyan)}
.camp small{display:block;color:var(--mute);font-weight:600;font-size:12px}
#b-cam[aria-expanded=true]{border-color:var(--cyan);color:#fff}
.b-eu{position:absolute;z-index:500;right:10px;top:84px;width:34px;height:34px;display:grid;place-items:center;padding:0;border:1px solid #1E2A30;background:#0B1013;color:#EEF2F4;cursor:pointer}
.b-eu svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.b-eu svg circle:first-child{fill:currentColor;stroke:none}
.b-eu.busca-gps{color:var(--cyan);animation:gps 1s infinite alternate}
@keyframes gps{to{opacity:.35}}
.leaflet-top.leaflet-right{margin-top:0}
.leaflet-control-zoom{border:1px solid #1E2A30!important;box-shadow:0 4px 14px rgba(0,0,0,.35)!important}
.eu{width:22px;height:22px;border-radius:50%;background:#5B8CFF;border:3px solid #fff;box-shadow:0 0 0 0 rgba(91,140,255,.6);animation:eu 1.8s infinite}
@keyframes eu{70%{box-shadow:0 0 0 16px rgba(91,140,255,0)}100%{box-shadow:0 0 0 0 rgba(91,140,255,0)}}
/* rótulo da região: anel com a % dominada */
.rg{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:30px;background:rgba(6,10,12,.86);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 6px 22px rgba(0,0,0,.45),0 0 18px color-mix(in srgb,var(--c) 22%,transparent);white-space:nowrap;cursor:pointer;transition:transform .2s,opacity .2s;animation:pop .35s ease-out}
.rg:hover{transform:translate(-50%,-50%) scale(1.05)}
.rg .anel{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 1%),rgba(255,255,255,.09) 0)}
.rg .anel b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#070B0D;font:900 15px/1 "Big Shoulders Display",Impact,sans-serif;color:#fff}
.rg .anel b small{font-size:9px;margin-left:1px}

let aqui = null;
const km = (a, b) => { const r = 6371, dl = (b[0] - a[0]) * Math.PI / 180, dn = (b[1] - a[1]) * Math.PI / 180; const x = Math.sin(dl / 2) ** 2 + Math.cos(a[0] * Math.PI / 180) * Math.cos(b[0] * Math.PI / 180) * Math.sin(dn / 2) ** 2; return 2 * r * Math.asin(Math.sqrt(x)); };
/* ordem da rota: manhã antes da tarde; dentro do turno, sempre a mais perto da anterior (começando de onde a dupla está, se o celular deixar) */
function ordena(itens) {
 const out = []; let ref = aqui;
 for (const t of ['manha', 'tarde']) {
  const resto = itens.filter(i => (i.turno || 'manha') === t);
  while (resto.length) { let k = 0;
   if (ref) { let best = Infinity; resto.forEach((i, n) => { if (i.lat == null) return; const d = km(ref, [+i.lat, +i.lng]); if (d < best) { best = d; k = n; } }); }
   const it = resto.splice(k, 1)[0]; out.push(it); if (it.lat != null) ref = [+it.lat, +it.lng]; }
 }
 return out;
}

async function carrega() {
 const r = await api('estado'); if (r.erro) { toast(r.erro, true); return; }
 S = Object.assign(r, { empresas:r.empresas.map(E), carregado:true });
 if (!$('#segp').hidden) segPainel();
 if (!COB) { desenhaCabo(); if (COB && COB.length) map.fitBounds(L.polygon(COB).getBounds(), enquadra()); }
 desenha();
}
/* ---------- leitura do QR ao vivo: o ponto pisca e aparece o aviso ---------- */
let desde = -1;
async function novidades() {
 const r = await api('novidades', null, '&desde=' + desde);
 if (r.ultimo != null) { for (const l of r.leituras || []) { const e = S.empresas.find(x => x.id === l.id); const p = e && pos(e);
   toast(`📍 Alguém leu o QR de ${l.nome} agora`, false, ['Ver', () => abreFicha(l.id)]);
   if (p) { const m = L.marker(p, { interactive:false, icon:L.divIcon({ className:'', iconSize:[70, 70], html:'<div class="pulso"></div>' }) }).addTo(map); setTimeout(() => map.removeLayer(m), 6000); }
   if (e) e.leit++; }
  desde = r.ultimo; }
}
setInterval(() => { if (!document.hidden) novidades(); }, 20000);

/* ---------- regiões automáticas pela concentração das empresas ---------- */
async function regioesAuto(pergunta) {
 const r = await api('regioes_auto', { k:7 }); if (r.erro) { if (pergunta) toast(r.erro, true); return; }
 toast(r.msg); regSel = null; await carrega(); painelLista(filtradas());
}
$('#b-auto').addEventListener('click', () => {
 const b = $('#b-auto'); if (b.dataset.c !== '1') { b.dataset.c = '1'; b.textContent = 'Refazer as automáticas? Clique de novo'; setTimeout(() => { b.dataset.c = ''; b.textContent = 'Regiões automáticas'; }, 4000); return; }
 b.dataset.c = ''; b.textContent = 'Regiões automáticas'; regioesAuto(true);
});

/* ---------- tour de uso (5 passos) ---------- */
const PASSOS = [
 ['#map', 'O mapa de Araguari', 'O contorno verde é o cabo da Nio. Cada região tem a porcentagem dominada; a célula acende em ciano quando tem empresa conquistada. Os pontos são as empresas, na cor da etapa; de longe, a mancha mostra onde estão concentradas.'],
 ['#chips', 'As cores', 'Cinza a agendar, amarelo agendado, azul visitado, ciano afiliado, verde QR ativo, dourado com venda. Toque numa etapa para esconder ou mostrar. Dois toques mostram só ela.'],
 ['#lado', 'Região e lista', 'Clique numa região: aparece a lista das empresas dali. Clique numa empresa para abrir a ficha com tudo dela.'],
 ['.abas [data-v="ligar"]', 'Agendar', 'Abre a fila e liga um por um. Depois da ligação, toque no resultado (Agendou, Não atendeu, Não quer…) e a próxima empresa já aparece.'],
 ['.abas [data-v="agenda"]', 'Agenda e Base', 'Em Agenda ficam as visitas de cada dia, de manhã e à tarde. Em Base vocês sobem a planilha e cadastram a empresa achada na rua.']];
let passo = 0;
function tour(i) {
 if (i >= PASSOS.length || i < 0) { $('#tour').hidden = true; try { localStorage.setItem('crm_tour_v2', '1'); } catch (e) {} return; }
 passo = i; const [sel, t, txt] = PASSOS[i]; $('#tour').hidden = false;
 const c = $('#tour-c'); c.innerHTML = `<div class="n">${i + 1} de ${PASSOS.length}</div><h3 id="tour-t">${t}</h3><p>${txt}</p><div class="pts">${PASSOS.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div>
  <div class="g2" style="margin-top:14px"><button class="bt" type="button" data-t="${i - 1}"${i ? '' : ' disabled'}>Voltar</button><button class="bt go" type="button" data-t="${i + 1}">${i === PASSOS.length - 1 ? 'Entendi' : 'Próximo'}</button></div>
  <button class="pular" type="button" data-t="99">Pular o tour (Esc)</button>`;
 posTour(); c.querySelector('.go').focus();
}
function posTour() {
 if ($('#tour').hidden) return;
 const alvo = document.querySelector(PASSOS[passo][0]), c = $('#tour-c'), luz = $('#tour-luz'), W = innerWidth, H = innerHeight, m = 14;
 const r = alvo ? alvo.getBoundingClientRect() : { left:W / 2, top:H / 2, right:W / 2, bottom:H / 2, width:0, height:0 };
 const p = 4; luz.style.left = (r.left - p) + 'px'; luz.style.top = (r.top - p) + 'px'; luz.style.width = (r.width + p * 2) + 'px'; luz.style.height = (r.height + p * 2) + 'px';
 const w = c.offsetWidth, hh = c.offsetHeight; let x, y;
 if (r.width > W * .55 && r.height > H * .45) { x = r.left + 24; y = r.top + 72; }          /* alvo grande (o mapa): balão por dentro */
 else if (r.right + m + w <= W - 8) { x = r.right + m; y = r.top; }                          /* à direita */
 else if (r.left - m - w >= 8) { x = r.left - m - w; y = r.top; }                            /* à esquerda */
 else if (r.bottom + m + hh <= H - 8) { x = r.left; y = r.bottom + m; }                      /* embaixo */
 else { x = r.left; y = r.top - m - hh; }                                                     /* em cima */
 c.style.left = Math.max(8, Math.min(x, W - w - 8)) + 'px'; c.style.top = Math.max(8, Math.min(y, H - hh - 8)) + 'px';
}
addEventListener('resize', posTour);
$('#tour').addEventListener('click', ev => { const b = ev.target.closest('[data-t]'); if (b) tour(+b.dataset.t); });
document.addEventListener('keydown', ev => { if (!$('#tour').hidden && ev.key === 'Escape') tour(99); });
$('#b-tour').addEventListener('click', () => tour(0));
carrega().then(async () => { novidades(); if (!S.regioes.length && S.empresas.filter(e => e.lat != null).length >= 30) await regioesAuto(false); painelLista(filtradas()); const aba = (location.hash || '').slice(1); if (['ligar', 'agenda', 'base'].includes(aba)) { history.replaceState(null, '', location.pathname); troca(aba); } else if (/^e\d+$/.test(aba)) { history.replaceState(null, '', location.pathname); abreFicha(+aba.slice(1)); } let visto = false; try { visto = localStorage.getItem('crm_tour_v2') === '1'; } catch (e) {} if (!visto) setTimeout(() => tour(0), 600); });
}
</script>
