<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Conquista Araguari · CRM Hunter League</title>

<style>
:root{color-scheme:dark;--bg:#050607;--panel:#0B1013;--p2:#0F171B;--edge:#1E2A30;--ink:#EEF2F4;--mute:#8A959C;--cyan:#19F7FF;--nio:#32E000;--amb:#FFB547;--azul:#5B8CFF;--ouro:#FFD84D;--red:#FF5C7A;--cinza:#6B777D}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 Montserrat,system-ui,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:12px;padding:10px 14px calc(10px) max(14px,env(safe-area-inset-left));border-bottom:1px solid var(--edge);background:#07090A;flex-wrap:wrap}
.top a.vol{color:var(--mute);text-decoration:none;font-weight:700;font-size:14px}
.top h1{margin:0;font:900 26px/1 "Big Shoulders Display",Impact,sans-serif;text-transform:uppercase;letter-spacing:.01em}
.top h1 span{color:var(--cyan)}
.abas{display:flex;gap:4px;margin-left:8px}
.abas button{min-height:38px;padding:6px 14px;border:1px solid var(--edge);background:var(--panel);color:var(--mute);font-weight:800;font-size:14px;cursor:pointer}
.abas button[aria-selected=true]{background:var(--cyan);color:#050607;border-color:var(--cyan)}
.placar{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.placar div{padding:4px 10px;background:var(--panel);border:1px solid var(--edge);text-align:center;min-width:76px}
.placar b{display:block;font:900 20px/1.05 "Big Shoulders Display",Impact,sans-serif}
.placar small{color:var(--mute);font-size:11px;font-weight:700}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 420px;height:calc(100vh - 62px);height:calc(100dvh - 62px)}
#map{position:relative;background:#06090B}
.leaflet-container{background:#06090B;font:600 13px Montserrat,sans-serif}
/* OpenStreetMap escurecido para combinar com o app */
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.78) contrast(.92) saturate(.35)}
.leaflet-control-attribution{background:rgba(5,6,7,.75)!important;color:#8A959C!important}.leaflet-control-attribution a{color:#8A959C!important}
.leaflet-bar a{background:#0B1013!important;color:#EEF2F4!important;border-color:#1E2A30!important}
.ferr{position:absolute;z-index:500;left:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 70px)}
.ferr button,.ferr select,.ferr input{min-height:36px;padding:5px 11px;border:1px solid var(--edge);background:rgba(11,16,19,.92);color:var(--mute);font-weight:700;font-size:13px;cursor:pointer}
.ferr input{cursor:text;width:170px;color:var(--ink)}
.ferr button[aria-pressed=true]{color:var(--ink);border-color:var(--cyan)}
.ferr .des[aria-pressed=true]{background:var(--amb);color:#050607;border-color:var(--amb)}
.segp{position:absolute;z-index:520;left:10px;top:56px;width:min(440px,calc(100% - 20px));max-height:60%;overflow:auto;padding:12px;background:rgba(11,16,19,.97);border:1px solid var(--edge)}
.segp .chips button{text-align:left}
.segp .chips b{margin-left:6px;color:var(--cyan)}
.leg{position:absolute;z-index:500;left:10px;bottom:22px;display:flex;flex-wrap:wrap;gap:4px 12px;max-width:calc(100% - 20px);padding:7px 11px;background:rgba(11,16,19,.92);border:1px solid var(--edge);font-size:12px;font-weight:700}
.leg button{border:0;background:none;padding:2px 0;color:var(--ink);font-weight:700;font-size:12px;cursor:pointer;opacity:.95}
.leg button[aria-pressed=false]{opacity:.35;text-decoration:line-through}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.bolha{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:rgba(5,6,7,.86);border:2px solid var(--c,#19F7FF);color:#fff;text-align:center;box-shadow:0 0 18px rgba(25,247,255,.25);cursor:pointer}
.bolha b{font:900 22px/1 "Big Shoulders Display",Impact,sans-serif}
.bolha small{display:block;font-size:9.5px;font-weight:800;color:#cfe;max-width:60px;line-height:1.1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lado{background:var(--panel);border-left:1px solid var(--edge);overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.lado h2{margin:0 0 2px;font:900 25px/1.05 "Big Shoulders Display",Impact,sans-serif;text-transform:uppercase}
.sub{color:var(--mute);font-size:13.5px}
.sec{margin:18px 0 6px;font-size:12px;font-weight:800;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.tag{display:inline-block;padding:3px 9px;font-size:12px;font-weight:800;color:#050607}
.lin{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--edge);font-size:14px}
.lin span:first-child{color:var(--mute)}
.lin span:last-child{text-align:right;overflow-wrap:anywhere}
.bt,.abas button,.ferr button,.chips button,.placar div{clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.bt.go,.bt.ok,.bt.am{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;font-size:19px;text-transform:uppercase;letter-spacing:.02em}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 14px;border:1px solid var(--edge);background:var(--p2);color:var(--ink);font-weight:800;font-size:14px;cursor:pointer;text-decoration:none;text-align:center}
.bt.go{background:var(--cyan);color:#050607;border-color:var(--cyan)}
.bt.ok{background:var(--nio);color:#050607;border-color:var(--nio)}
.bt.am{background:var(--amb);color:#050607;border-color:var(--amb)}
.bt.rd{border-color:#5A2A35;color:#FFB3C1}
.bt:disabled{opacity:.5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.big{font:900 22px "Big Shoulders Display",Impact,sans-serif;text-transform:uppercase;min-height:56px}
.box{margin-top:12px;padding:12px;background:#0A1215;border:1px solid var(--edge)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:36px;padding:5px 11px;border:1px solid var(--edge);background:var(--p2);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--cyan);color:#050607;border-color:var(--cyan)}
label.f{display:block;margin-top:8px;font-size:13px;font-weight:700;color:var(--mute)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--edge);background:#070B0D;color:var(--ink);font-size:16px}
textarea{min-height:70px;resize:vertical}
.lista{list-style:none;margin:8px 0 0;padding:0}
.lista li{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:9px 6px;border-top:1px solid var(--edge);cursor:pointer}
.lista li:hover,.lista li:focus-visible{background:#0F1A1E;outline:none}
.lista li i{width:10px;height:10px;border-radius:50%}
.lista li small{display:block;color:var(--mute);font-size:12px}
.lista li em{font-style:normal;font-size:11.5px;font-weight:800;color:var(--amb);white-space:nowrap}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:7px 0;border-top:1px solid var(--edge);font-size:13.5px}
.hist li span{display:block;color:var(--mute);font-size:12px}
.barra{height:10px;background:#16222A;margin-top:6px}.barra i{display:block;height:100%;background:var(--cyan);transition:width .4s}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
table.t td,table.t th{border-top:1px solid var(--edge);padding:5px 4px;text-align:left;vertical-align:top}
.tour{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.55)}
.tour-c{position:absolute;width:min(360px,calc(100vw - 24px));padding:18px;background:#0B1013;border:2px solid var(--cyan);box-shadow:0 0 0 4000px rgba(0,0,0,0),0 18px 50px rgba(0,0,0,.7)}
.tour-c .n{font:900 14px Montserrat,sans-serif;color:var(--cyan)}
.tour-c h3{margin:4px 0 6px;font:900 26px/1.05 "Big Shoulders Display",Impact,sans-serif;text-transform:uppercase}
.tour-c p{margin:0;color:#C9D1D6}
.tour-c .pts{display:flex;gap:6px;margin-top:14px}.tour-c .pts i{flex:1;height:5px;background:#1E2A30}.tour-c .pts i.on{background:var(--cyan)}
.tour-alvo{position:relative;z-index:3001!important;outline:3px solid var(--cyan)!important;outline-offset:3px;box-shadow:0 0 30px rgba(25,247,255,.5)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2000;max-width:min(92vw,520px);padding:12px 18px;background:#0E2A2E;border:1px solid var(--cyan);font-weight:700;display:none}
.toast.on{display:block}.toast.err{background:#2A0E15;border-color:var(--red)}
details summary{cursor:pointer;font-weight:800;color:var(--mute);margin-top:16px}
.vazio{padding:20px 4px;color:var(--mute)}
.ajuda{margin-top:8px;padding:10px 12px;border-left:3px solid var(--amb);background:#1A140A;font-size:13.5px}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.leaflet-tooltip{background:#0B1013;color:#EEF2F4;border:1px solid #1E2A30;font-weight:700}
.leaflet-tooltip-top:before{border-top-color:#1E2A30}
@media(max-width:900px){body{overflow:auto}.wrap{grid-template-columns:1fr;height:auto}#map{height:62vh}.lado{border-left:0;border-top:1px solid var(--edge)}.placar{margin-left:0;width:100%}.placar div{flex:1;min-width:0}.abas{margin-left:0}}
</style>

<body>
<header class="top">
 <a class="vol" href="./">← Central</a>
 <h1>Conquista <span>Araguari</span></h1>
 <nav class="abas" role="tablist" aria-label="Seções">
  <button type="button" role="tab" data-v="mapa" aria-selected="true">Mapa</button>
  <button type="button" role="tab" data-v="ligar" aria-selected="false">Agendar</button>
  <button type="button" role="tab" data-v="agenda" aria-selected="false">Agenda</button>
  <button type="button" role="tab" data-v="base" aria-selected="false">Base</button>
 </nav>
 <div class="placar" id="placar"></div>
 <button class="bt" type="button" id="b-tour" aria-label="Como usar" style="min-height:38px;width:38px;padding:0;font-size:18px">?</button>
</header>
<div class="wrap">
 <div id="map" aria-label="Mapa de Araguari">
  <div class="ferr">
   <input id="busca" type="search" placeholder="Buscar empresa, bairro…" aria-label="Buscar">
   <button type="button" id="b-seg" aria-expanded="false">Segmentos</button>
      <button type="button" id="f-ligar" aria-pressed="false">A agendar</button>
   <button type="button" class="des" id="b-des" aria-pressed="false">Desenhar região</button>
  </div>
  <div class="segp" id="segp" hidden></div>
  <div class="leg" id="leg"></div>
 </div>
 <aside class="lado" id="lado" aria-live="polite"></aside>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="tour" id="tour" hidden><div class="tour-c" id="tour-c" role="dialog" aria-modal="true" aria-labelledby="tour-t"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
{
const B = window.CRM || {}; const $ = s => document.querySelector(s);
const h = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
const toast = (t, err) => { const x = $('#toast'); x.textContent = t; x.className = 'toast on' + (err ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => x.className = 'toast', 3800); };
const api = async (a, dados, q = '') => {
 const op = dados instanceof FormData ? { method:'POST', headers:{ 'X-CSRF':B.token }, body:dados }
  : dados ? { method:'POST', headers:{ 'Content-Type':'application/json', 'X-CSRF':B.token }, body:JSON.stringify(dados) } : {};
 try { const r = await fetch('crm-api.php?a=' + a + q, op); if (r.status === 401) { location.href = './'; return {}; } return await r.json(); }
 catch (e) { return { erro:'Sem conexão. Tente de novo.' }; }
};
const COR = { mapeado:'#6B777D', agendado:'#FFB547', visitado:'#5B8CFF', afiliado:'#19F7FF', conquistado:'#32E000', venda:'#FFD84D', perdido:'#FF5C7A' };
const ETN = { mapeado:'Mapeado', agendado:'Agendado', visitado:'Visitado', afiliado:'Afiliado', conquistado:'QR ativo', venda:'Com venda', perdido:'Perdido' };
const CONQ = new Set(['afiliado', 'conquistado', 'venda']);
let segOn = new Set(), S = { empresas:[], regioes:[], celulas:[], geo:{} }, vis = 'mapa', etapasOn = new Set(Object.keys(COR)), regSel = null, fichaId = null, camadas = { cabo:true, reg:true, hex:true, ind:true };
/* empresas: [id, nome, seg, bairro, lat, lng, etapa, vencido, noCabo, geo, temTel, leituras, indicados] */
const E = r => ({ id:r[0], nome:r[1], seg:r[2], bairro:r[3], lat:r[4], lng:r[5], et:r[6], venc:r[7] === 1 ? 1 : 0, fut:r[7] === 2, cabo:r[8], geo:r[9], tel:r[10], leit:r[11], ind:r[12] });

/* ---------- mapa ---------- */
const map = L.map('map', { preferCanvas:true, zoomControl:false }).setView([-18.6475, -48.1875], 14);
L.control.zoom({ position:'topright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'&copy; OpenStreetMap' }).addTo(map);
const G = { cabo:L.layerGroup().addTo(map), hex:L.layerGroup().addTo(map), reg:L.layerGroup().addTo(map), emp:L.layerGroup().addTo(map), ind:L.layerGroup().addTo(map), des:L.layerGroup().addTo(map) };
const rend = L.canvas({ padding:.3 });
/* empresas mapeadas só pelo bairro ficam espalhadas em volta do centro do bairro (até refinar pela rua) */
const pos = e => { if (e.lat == null) return null; if (e.geo === 'bairro' || e.geo === 'bairro_ok') { const a = (e.id * 2.39996) % 6.283, d = 0.0006 + ((e.id * 7919) % 100) / 100 * 0.0022; return [e.lat + Math.sin(a) * d, e.lng + Math.cos(a) * d * 1.05]; } return [e.lat, e.lng]; };
const dentro = (p, poly) => { let o = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [yi, xi] = poly[i], [yj, xj] = poly[j]; if ((yi > p[0]) !== (yj > p[0]) && p[1] < (xj - xi) * (p[0] - yi) / ((yj - yi) || 1e-12) + xi) o = !o; } return o; };
function filtradas() {
 const q = $('#busca').value.trim().toLowerCase(), lig = $('#f-ligar').getAttribute('aria-pressed') === 'true';
 return S.empresas.filter(e => etapasOn.has(e.et) && (!segOn.size || segOn.has(e.seg)) && (!lig || (e.et === 'mapeado' && e.tel && !e.fut))
  && (!q || (e.nome + ' ' + e.bairro + ' ' + e.seg).toLowerCase().includes(q)));
}
function desenhaCabo() {
 G.cabo.clearLayers(); if (!camadas.cabo) return;
 for (const c of S.celulas) for (const p of c.polys) L.polygon(p, { color:'#32E000', weight:1, opacity:.55, dashArray:'4 4', fillColor:'#32E000', fillOpacity:c.status.startsWith('Sem') ? .06 : .02, interactive:true, renderer:rend })
  .bindTooltip(`Célula ${h(c.nome)} · ${h(c.status)}<br>${c.hpv} domicílios viáveis · ${c.hc} clientes`, { sticky:true }).addTo(G.cabo);
}
/* territórios em hexágono (~170 m): acendem com as empresas conquistadas dentro */
let HEX = null;
function montaHex() {
 const R = 170, lat0 = -18.6475, mx = 111320 * Math.cos(lat0 * Math.PI / 180), my = 110540;
 const toXY = (la, lo) => [(lo + 48.1875) * mx, (la - lat0) * my], toLL = (x, y) => [y / my + lat0, x / mx - 48.1875];
 const axial = (x, y) => { const q = (Math.sqrt(3) / 3 * x - y / 3) / R, r = (2 / 3 * y) / R; let rq = Math.round(q), rr = Math.round(r), rs = Math.round(-q - r);
  const dq = Math.abs(rq - q), dr = Math.abs(rr - r), ds = Math.abs(rs + q + r); if (dq > dr && dq > ds) rq = -rr - rs; else if (dr > ds) rr = -rq - rs; return rq + ',' + rr; };
 const centro = k => { const [q, r] = k.split(',').map(Number); return toLL(R * Math.sqrt(3) * (q + r / 2), R * 1.5 * r); };
 const canto = k => { const [la, lo] = centro(k), [x, y] = toXY(la, lo); return Array.from({ length:6 }, (_, i) => { const a = Math.PI / 180 * (60 * i - 30); return toLL(x + R * Math.cos(a), y + R * Math.sin(a)); }); };
 const cabo = new Set();
 for (const c of S.celulas) for (const p of c.polys) { const la = p.map(v => v[0]), lo = p.map(v => v[1]);
  for (let a = Math.min(...la); a <= Math.max(...la); a += 0.0009) for (let o = Math.min(...lo); o <= Math.max(...lo); o += 0.0009) if (dentro([a, o], p)) cabo.add(axial(...toXY(a, o))); }
 HEX = { axial, toXY, canto, cabo };
}
function desenhaHex(lista) {
 G.hex.clearLayers(); if (!camadas.hex || !HEX) return;
 const n = {}; for (const e of lista) { if (!CONQ.has(e.et)) continue; const p = pos(e); if (!p) continue; const k = HEX.axial(...HEX.toXY(...p)); n[k] = (n[k] || 0) + (e.et === 'afiliado' ? .5 : 1); }
 for (const k of HEX.cabo) { const v = n[k] || 0;
  L.polygon(HEX.canto(k), { renderer:rend, interactive:false, weight:v ? 1.2 : .5, color:v ? '#19F7FF' : '#1A3036', opacity:v ? .9 : .5, fillColor:'#19F7FF', fillOpacity:v ? Math.min(.15 + v * .15, .55) : .03 }).addTo(G.hex); }
 return Object.keys(n).length;
}
function desenhaRegioes(lista) {
 G.reg.clearLayers(); if (!camadas.reg) return;
 for (const r of S.regioes) {
  const den = lista.filter(e => { const p = pos(e); return p && dentro(p, r.poly); });
  const conq = den.filter(e => CONQ.has(e.et)).length;
  L.polygon(r.poly, { color:r.cor, weight:regSel === r.id ? 3 : 1.6, opacity:.95, fillColor:r.cor, fillOpacity:regSel === r.id ? .1 : .04, renderer:rend }).on('click', () => abreRegiao(r.id)).addTo(G.reg);
  const c = L.polygon(r.poly).getBounds().getCenter();
  L.marker(c, { icon:L.divIcon({ className:'', iconSize:[64, 64], html:`<div class="bolha" style="--c:${h(r.cor)}"><div><b>${den.length}</b><small>${h(r.nome)}</small></div></div>` }) })
   .bindTooltip(`${h(r.nome)}: ${den.length} empresas · ${conq} conquistadas`).on('click', () => abreRegiao(r.id)).addTo(G.reg);
 }
}
function desenhaEmpresas(lista) {
 G.emp.clearLayers(); G.ind.clearLayers();
 for (const e of lista) { const p = pos(e); if (!p) continue;
  const sel = e.id === fichaId;
  L.circleMarker(p, { renderer:rend, radius:sel ? 8 : (CONQ.has(e.et) ? 6 : 4.5), color:sel ? '#fff' : '#050607', weight:sel ? 2.5 : 1, fillColor:COR[e.et], fillOpacity:e.et === 'perdido' ? .45 : .95 })
   .bindTooltip(`${h(e.nome)}<br><span style="color:#8A959C">${h(e.seg)} · ${ETN[e.et]}</span>`).on('click', () => abreFicha(e.id)).addTo(G.emp);
  if (camadas.ind && (e.leit || e.ind)) L.circleMarker(p, { renderer:rend, radius:9 + Math.min(e.leit + e.ind * 2, 24) / 2, color:'#32E000', weight:2, opacity:.6, fill:false, interactive:false }).addTo(G.ind)
   .bindTooltip(`${e.leit} leituras do QR · ${e.ind} indicados`, { permanent:false });
 }
}
function desenha() {
 const l = filtradas(); desenhaRegioes(l); const t = desenhaHex(l); desenhaEmpresas(l); placar(t);
 if (vis === 'mapa' && !fichaId && !regSel) painelLista(l);
}
function placar(terr) {
 const c = k => S.empresas.filter(e => e.et === k).length, tot = S.empresas.length, conq = S.empresas.filter(e => CONQ.has(e.et)).length;
 const pct = HEX && HEX.cabo.size ? Math.round((terr || 0) / HEX.cabo.size * 100) : 0;
 $('#placar').innerHTML = [[tot, 'mapeadas'], [S.ligadas_hoje || 0, 'ligadas hoje'], [c('agendado'), 'agendadas'], [conq, 'afiliados'], [c('conquistado') + c('venda'), 'QR ativo'], [pct + '%', 'território']]
  .map(([v, t]) => `<div><b>${v}</b><small>${t}</small></div>`).join('');

 fichaId = null;
 if (v === 'mapa') { desenha(); regSel ? abreRegiao(regSel) : painelLista(filtradas()); }
 if (v === 'ligar') { proximo(); }
 if (v === 'agenda') agenda();
 if (v === 'base') base();
}
document.querySelector('.abas').addEventListener('click', ev => { const b = ev.target.closest('[data-v]'); if (b) troca(b.dataset.v); });

async function agenda(dia) {
 const r = await api('agenda', null, dia ? '&dia=' + dia : ''); if (r.erro) return toast(r.erro, true);
 const turno = t => r.itens.filter(i => (i.turno || 'manha') === t);
 const bloco = (t, nome) => `<p class="sec">${nome} · ${turno(t).length}</p><ul class="lista">${turno(t).map(i => `<li data-id="${i.id}" tabindex="0"><i style="background:${COR[i.etapa]}"></i><span>${h(i.nome)}<small>${h(i.end)}${i.resp ? ' · ' + h(i.resp) : ''}${i.quem ? ' · vai: ' + h(i.quem) : ''}</small></span><a class="bt" href="tel:+55${h(i.tel || '')}" style="min-height:34px" onclick="event.stopPropagation()">Ligar</a></li>`).join('') || '<li><span></span><span class="sub">Nenhuma visita.</span></li>'}</ul>`;
 lado.innerHTML = `<h2>Agenda de visitas</h2><label class="f">Dia<input type="date" id="ag-dia" value="${r.dia}"></label>
  <p class="sub" style="margin-top:8px">${r.itens.length} visitas. Clique numa visita para abrir a ficha e marcar o resultado. Na véspera, ligue ou mande mensagem para confirmar.</p>
  ${bloco('manha', 'Manhã')}${bloco('tarde', 'Tarde')}`;
 $('#ag-dia').onchange = ev => agenda(ev.target.value);
 G.des.clearLayers(); r.itens.forEach((i, k) => { if (i.lat) L.marker([+i.lat, +i.lng], { icon:L.divIcon({ className:'', iconSize:[26, 26], html:`<div style="display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#FFB547;color:#050607;font-weight:900;border:2px solid #050607">${k + 1}</div>` }) }).addTo(G.des); });
}

let novaPonto = null, novaMarcando = false, geoRodando = false;
async function base() {
 const g = S.geo || {}, t = g.t || 0, feito = (g.bairro || 0) + (g.rua || 0) + (g.so_bairro || 0) + (g.falhou || 0);
 const pr = t ? Math.round(((g.rua || 0) + (g.so_bairro || 0) + (g.falhou || 0)) / t * 100) : 0;
 lado.innerHTML = `<h2>Base de empresas</h2><p class="sub">${t} empresas na base${g.fora ? `, ${g.fora} delas fora do cabo (guardadas, não aparecem)` : ''}.</p>
  <p class="sec">1 · Subir a planilha da Casa dos Dados</p>
  <form id="f-imp" class="box"><input type="file" name="arq" accept=".xlsx,.csv,.txt" required style="width:100%">
   <label class="f" style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" name="so_cidade" value="1" checked style="width:auto;margin:0"> Só empresas de Araguari</label>
   <label class="f" style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" name="so_ativa" value="1" checked style="width:auto;margin:0"> Só situação ativa</label>
   <button class="bt go" type="submit" style="margin-top:10px;width:100%">Ver prévia</button></form><div id="imp-r"></div>
  <p class="sec">2 · Mapear endereços</p>
  <div class="box"><p class="sub" style="margin:0">Primeiro pelo bairro (rápido, já dá a contagem por região). Depois pela rua, aos poucos (1 endereço por segundo). Pode deixar rodando com esta aba aberta.</p>
   <div class="barra"><i style="width:${pr}%"></i></div>
   <p class="sub">${g.rua || 0} pela rua · ${(g.bairro || 0) + (g.so_bairro || 0)} pelo bairro · ${g.sem || 0} sem mapear · ${g.falhou || 0} não achados${g.fora ? ` · <b>${g.fora} fora do cabo, guardadas</b>` : ''}</p>
   <button class="bt ${geoRodando ? 'am' : 'go'}" type="button" id="b-geo" style="width:100%">${geoRodando ? 'Pausar mapeamento' : 'Mapear endereços'}</button></div>
  ${g.falhou ? `<p class="sec">Não achados (${g.falhou})</p><p class="sub">Abra a empresa e clique em "Ajustar ponto" para marcar no mapa.</p><ul class="lista">${S.empresas.filter(e => e.geo === 'falhou').slice(0, 60).map(itemLista).join('')}</ul>` : ''}
  <p class="sec">3 · Cadastrar empresa achada na rua</p>
  <form id="f-nova" class="box"><label class="f">Nome<input name="fantasia" required maxlength="160"></label><div class="g2"><label class="f">Segmento<input name="segmento" maxlength="60" list="segs"></label><label class="f">Telefone<input name="tel1" inputmode="tel" maxlength="20"></label></div>
   <label class="f">Responsável<input name="responsavel" maxlength="120"></label><div class="g2"><label class="f">Rua<input name="logradouro" maxlength="160"></label><label class="f">Número<input name="numero" maxlength="20"></label></div><label class="f">Bairro<input name="bairro" maxlength="100"></label>
   <p class="sub" id="n-pt">Clique no mapa para marcar o ponto (opcional).</p><button class="bt go" type="submit" style="width:100%">Cadastrar</button></form>
  <datalist id="segs">${[...new Set(S.empresas.map(e => e.seg).filter(Boolean))].map(s => `<option value="${h(s)}">`).join('')}</datalist>`;
 novaPonto = null; novaMarcando = true;
 $('#f-nova').onsubmit = async ev => { ev.preventDefault(); const d = Object.fromEntries(new FormData(ev.target)); if (novaPonto) { d.lat = novaPonto[0]; d.lng = novaPonto[1]; }
  const r = await api('salvar', d); if (r.erro) return toast(r.erro, true); toast('Empresa cadastrada.'); novaPonto = null; novaMarcando = false; G.des.clearLayers(); await carrega(); abreFicha(r.id); };
 $('#f-imp').onsubmit = async ev => { ev.preventDefault(); const fd = new FormData(ev.target); fd.set('so_cidade', ev.target.so_cidade.checked ? '1' : '0'); fd.set('so_ativa', ev.target.so_ativa.checked ? '1' : '0');
  $('#imp-r').innerHTML = '<p class="vazio">Lendo a planilha…</p>'; const r = await api('importar', fd); mostraPrevia(r, fd); };
 $('#b-geo').onclick = () => { geoRodando = !geoRodando; base(); if (geoRodando) rodaGeo(); };
}
function mostraPrevia(r, fd) {
 if (r.erro) { $('#imp-r').innerHTML = `<p class="ajuda">${h(r.erro)}${r.cabecalho ? '<br>Colunas: ' + h(r.cabecalho.join(' | ')) : ''}</p>`; return; }
 $('#imp-r').innerHTML = `<div class="box"><b>${r.total} empresas para entrar</b><p class="sub">${r.ja} já estão na base (serão atualizadas, sem perder o histórico) · ${r.sem_tel} sem telefone · ${r.fora_cidade} de outras cidades e ${r.inativas} inativas ficaram de fora.</p>
  ${r.nao_achou.length ? `<p class="ajuda">Não achei estas colunas: ${h(r.nao_achou.join(', '))}. Se existirem com outro nome, me avise.</p>` : ''}
  <p class="sec">Segmentos</p>${Object.entries(r.segmentos).map(([k, v]) => `<div class="lin"><span>${h(k)}</span><span>${v}</span></div>`).join('')}
  <p class="sec">Amostra</p><table class="t">${r.amostra.map(a => `<tr><td>${h(a[0])}<br><span class="sub">${h(a[1])}</span></td><td>${h(a[2])}<br><span class="sub">${h(a[3])}</span></td></tr>`).join('')}</table>
  <button class="bt ok" type="button" id="b-grav" style="margin-top:10px;width:100%">Gravar ${r.total} empresas</button></div>`;
 $('#b-grav').onclick = async () => { $('#b-grav').disabled = true; $('#b-grav').textContent = 'Gravando…'; const g = new FormData(); g.set('gravar', '1'); g.set('so_cidade', fd.get('so_cidade')); g.set('so_ativa', fd.get('so_ativa'));
  const x = await api('importar', g); if (x.erro) { $('#b-grav').disabled = false; $('#b-grav').textContent = 'Tentar de novo'; return toast(x.erro, true); } toast(x.msg); await carrega(); base(); };
}
async function rodaGeo() {
 while (geoRodando) { const r = await api('geo', {}); if (r.erro) { toast(r.erro, true); geoRodando = false; break; } S.geo = r.geo;
  if (vis === 'base') base(); const g = r.geo; if (!g.sem && !g.bairro) { geoRodando = false; toast('Mapeamento concluído.'); await carrega(); if (vis === 'base') base(); break; }
  if (Math.random() < .3) { await carrega(); } }
}

/* ---------- carga ---------- */
async function carrega() {
 const r = await api('estado'); if (r.erro) { toast(r.erro, true); return; }
 S = Object.assign(r, { empresas:r.empresas.map(E) });
 if (!$('#segp').hidden) segPainel();
 if (!HEX) { montaHex(); desenhaCabo(); }
 desenha();
}
/* ---------- tour de uso (5 passos) ---------- */
const PASSOS = [
 ['#map', 'O mapa de Araguari', 'A mancha verde é o cabo da Nio. Cada bolinha grande é uma região com o total de empresas. Os pontos são as empresas, na cor da etapa.'],
 ['#leg', 'As cores', 'Cinza a agendar, amarelo agendado, azul visitado, ciano afiliado, verde QR ativo, dourado com venda. Toque numa cor para esconder ou mostrar.'],
 ['#lado', 'Região e lista', 'Clique numa região: aparece a lista das empresas dali. Clique numa empresa para abrir a ficha com tudo dela.'],
 ['.abas [data-v="ligar"]', 'Agendar', 'Abre a fila e liga um por um. Depois da ligação, toque no resultado (Agendou, Não atendeu, Não quer…) e a próxima empresa já aparece.'],
 ['.abas [data-v="agenda"]', 'Agenda e Base', 'Em Agenda ficam as visitas de cada dia, de manhã e à tarde. Em Base vocês sobem a planilha e cadastram a empresa achada na rua.']];
let passo = 0;
function tour(i) {
 document.querySelectorAll('.tour-alvo').forEach(x => x.classList.remove('tour-alvo'));
 if (i >= PASSOS.length || i < 0) { $('#tour').hidden = true; try { localStorage.setItem('crm_tour_v1', '1'); } catch (e) {} return; }
 passo = i; const [sel, t, txt] = PASSOS[i], alvo = document.querySelector(sel); $('#tour').hidden = false;
 if (alvo) alvo.classList.add('tour-alvo');
 const c = $('#tour-c'); c.innerHTML = `<div class="n">${i + 1} de ${PASSOS.length}</div><h3 id="tour-t">${t}</h3><p>${txt}</p><div class="pts">${PASSOS.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div>
  <div class="g2" style="margin-top:14px"><button class="bt" type="button" data-t="${i - 1}"${i ? '' : ' disabled'}>Voltar</button><button class="bt go" type="button" data-t="${i + 1}">${i === PASSOS.length - 1 ? 'Entendi' : 'Próximo'}</button></div>
  <button type="button" data-t="99" style="margin-top:10px;border:0;background:none;color:var(--mute);font-weight:700;cursor:pointer">Pular</button>`;
 const r = alvo ? alvo.getBoundingClientRect() : { left:20, top:80, right:20, bottom:80, width:0 };
 const w = c.offsetWidth, hh = c.offsetHeight;
 let x = r.right + 14, y = r.top; if (x + w > innerWidth - 8) x = Math.max(8, r.left - w - 14); if (x < 8 || r.width > innerWidth * .5) { x = Math.min(innerWidth - w - 8, Math.max(8, r.left + 20)); y = Math.min(innerHeight - hh - 12, r.top + 60); }
 c.style.left = x + 'px'; c.style.top = Math.max(8, Math.min(y, innerHeight - hh - 8)) + 'px';
 c.querySelector('.go').focus();
}
$('#tour').addEventListener('click', ev => { const b = ev.target.closest('[data-t]'); if (b) tour(+b.dataset.t); });
document.addEventListener('keydown', ev => { if (!$('#tour').hidden && ev.key === 'Escape') tour(99); });
$('#b-tour').addEventListener('click', () => tour(0));
legenda();
carrega().then(() => { painelLista(filtradas()); let visto = false; try { visto = localStorage.getItem('crm_tour_v1') === '1'; } catch (e) {} if (!visto) setTimeout(() => tour(0), 600); });
}
</script>
