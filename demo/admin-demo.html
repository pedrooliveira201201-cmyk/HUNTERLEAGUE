<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050607">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<title>Central | Hunter League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/*
Central da CallNet (admin da Hunter League). Mesma estética do app: preto, ciano, chanfros do brasão.
Feita para o dia a dia: o que fazer hoje, registrar indicação colando o WhatsApp, avançar etapas com um toque, liberar o bônus após a 1ª fatura e pagar os saques.
*/
:root{color-scheme:dark;--bg:#050607;--p1:#0B1013;--p2:#10171B;--ln:#1B252B;--ln2:#26333A;--ink:#EEF2F4;--sil:#BEC5CC;--mut:#7E8A92;--c:#19F7FF;--c2:#AEFCFF;--b:#0079FD;--ok:#4DF0A0;--warn:#FFC857;--bad:#FF6B81;--cut:12px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:radial-gradient(60% 40% at 0 0,rgba(25,247,255,.07),transparent 60%),radial-gradient(50% 40% at 100% 100%,rgba(0,121,253,.07),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:500 15px/1.45 Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:var(--c)}
.ch{clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.bs{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:.01em}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}

/* estrutura: barra lateral no computador, barra de baixo no celular */
.side{position:fixed;left:0;top:0;bottom:0;width:248px;display:flex;flex-direction:column;gap:6px;padding:20px 14px;background:linear-gradient(180deg,#081014,#050708);border-right:1px solid var(--ln);z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 14px}
.brand img{width:44px;height:auto}
.brand b{display:block;font-size:22px;line-height:.95}
.brand small{display:block;color:var(--mut);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.novo{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;margin:4px 0 12px;border:0;background:var(--c);color:#050607;font:900 19px "Big Shoulders Display",Impact,sans-serif;text-transform:uppercase;box-shadow:0 0 24px rgba(25,247,255,.25)}
.novo:active{transform:scale(.97)}
.nv{display:flex;align-items:center;gap:12px;width:100%;height:48px;padding:0 12px;border:0;background:none;color:var(--sil);font-weight:700;font-size:15px;text-align:left;border-left:3px solid transparent}
.nv svg{flex:none;color:var(--mut)}
.nv .ct{margin-left:auto;min-width:22px;height:22px;padding:0 6px;display:grid;place-items:center;background:var(--bad);color:#fff;font-size:12px;font-weight:800;clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
.nv.on{color:#fff;background:linear-gradient(90deg,rgba(25,247,255,.12),transparent);border-left-color:var(--c)}
.nv.on svg{color:var(--c)}
.side .foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--ln)}
.av{display:grid;place-items:center;flex:none;width:38px;height:38px;background:#12232A;color:var(--c2);font-weight:800;font-size:13px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.side .foot b{display:block;font-size:14px}.side .foot small{color:var(--mut);font-size:12px}
.side .foot button{margin-left:auto;border:0;background:none;color:var(--mut);padding:8px}
main{margin-left:248px;padding:28px 32px 60px;max-width:1240px}
main.largo{max-width:none}
.top{display:none}
.bot{display:none}
@media (max-width:900px){
 .side{display:none}
 main{margin:0;padding:calc(72px + var(--st)) 16px calc(96px + var(--sb))}
 .top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:10px;height:calc(60px + var(--st));padding:var(--st) 14px 0;background:rgba(5,6,7,.96);border-bottom:1px solid var(--ln)}
 .top img{width:34px}
 .top b{font-size:22px}
 .top .av{margin-left:auto;border:0}
 .bot{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:calc(68px + var(--sb));padding-bottom:var(--sb);background:#060809;border-top:1px solid var(--ln)}
 .bot button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:68px;border:0;background:none;color:var(--mut);font-size:11.5px;font-weight:700}
 .bot button.on{color:var(--c)}
 .bot button .ct{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 4px;display:grid;place-items:center;background:var(--bad);color:#fff;font-size:10.5px;font-weight:800;border-radius:9px}
 .bot .mais{align-self:center;justify-self:center;width:58px;height:58px;margin-bottom:22px;background:var(--c);color:#050607;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);box-shadow:0 0 20px rgba(25,247,255,.4)}
 .bot .mais span{display:none}
}

/* cabeçalho das telas */
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.hd h1{margin:0;font-size:clamp(40px,6vw,56px);line-height:.9}
.hd p{margin:6px 0 0;color:var(--mut);font-weight:600}
.hd .act{display:flex;gap:8px;flex-wrap:wrap}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border:0;background:var(--c);color:#050607;font-weight:800;font-size:14.5px;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);transition:transform .1s,filter .2s;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.96)}
.btn:hover{filter:brightness(1.08)}
.btn.g{background:#15222A;color:var(--ink)}
.btn.ok{background:var(--ok);color:#03140B}
.btn.bad{background:#3A1520;color:#FFB3C0}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px}
.btn:disabled{opacity:.5;pointer-events:none}
.ico{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--ln2);background:var(--p1);color:var(--sil);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}

/* hoje */
.ola{margin-bottom:26px}
.ola h1{margin:0;font-size:clamp(44px,7vw,64px);line-height:.9}
.ola h1 span{color:var(--c)}
.ola p{margin:8px 0 0;color:var(--mut);font-weight:600}.ola p::first-letter{text-transform:uppercase}
.tarefas{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tf{position:relative;display:flex;flex-direction:column;gap:6px;padding:20px 20px 18px;background:linear-gradient(150deg,var(--p2),var(--p1));border:1px solid var(--ln);overflow:hidden;--a:var(--c)}
.tf::before{content:"";position:absolute;left:0;top:0;width:64px;height:3px;background:var(--a);box-shadow:0 0 14px var(--a)}
.tf::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;background:radial-gradient(closest-side,color-mix(in srgb,var(--a) 18%,transparent),transparent);pointer-events:none}
.tf .n{font-size:58px;line-height:.85;color:var(--a)}
.tf b{font-size:17px}
.tf small{color:var(--mut);font-weight:600;font-size:13.5px;line-height:1.35}
.tf .btn{align-self:flex-start;margin-top:10px;background:var(--a)}
.emdia{display:flex;align-items:center;gap:18px;padding:26px;background:linear-gradient(120deg,rgba(77,240,160,.12),var(--p1));border:1px solid rgba(77,240,160,.3)}
.emdia .ok2{display:grid;place-items:center;flex:none;width:64px;height:64px;background:var(--ok);color:#03140B;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.emdia b{font-size:26px}.emdia p{margin:4px 0 0;color:var(--sil)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}@media (max-width:600px){.g3{grid-template-columns:1fr 1fr}}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:10px}
.tr{padding:18px;background:linear-gradient(150deg,#0E2328,#091317 70%);border:1px solid var(--ln);border-top:3px solid var(--a)}
.tr small{display:block;color:var(--a);font-weight:800;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase}
.tr b{display:block;font-size:clamp(30px,4.4vw,42px);line-height:1;margin:6px 0 4px}
.tr span{color:var(--sil);font-size:13px;font-weight:600}
.escada{margin:2px 0 18px;color:var(--mut);font-size:13px;font-weight:600}
.exp .mes{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 10px;border:1px solid var(--ln2);background:#0A1013;color:var(--mut);font-size:12.5px;font-weight:700}
.exp .mes input{background:transparent;border:0;color:var(--ink);font:inherit;outline:none;color-scheme:dark}
.cls{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.cl{padding:3px 8px;background:#0F1A1E;border:1px solid var(--ln);font-size:12px;color:var(--sil);font-weight:700}.cl i{font-style:normal;color:var(--mut)}
.fat{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:16px;align-items:center;padding:14px 16px;background:var(--p1);border:1px solid var(--ln)}
.fat.pronta{border-left:3px solid #FFC857}.fat .nm{font-weight:800}.fat .sub{color:var(--mut);font-size:12.5px;font-weight:600}.fat .val{font-size:24px}
.fat .qd{text-align:right}.fat .qd b{display:block;font-size:14px}.fat .qd small{color:var(--mut);font-size:12px;font-weight:700}
.lib{background:var(--p1);border:1px solid var(--ln)}.lib summary{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;list-style:none}
.lib summary::-webkit-details-marker{display:none}.lib .nm{display:block;font-weight:800}.lib .sub{display:block;color:var(--mut);font-size:12.5px;font-weight:600}.lib .val{font-size:24px;color:var(--c)}
.lib .li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;padding:10px 16px;border-top:1px solid var(--ln)}
.lib .li small{grid-column:1;color:var(--mut);font-size:12px}.lib .li b{grid-row:1/3;grid-column:2}.lib .li .lk{grid-row:1/3;grid-column:3}
.lk{background:none;border:0;color:var(--mut);font-weight:700;font-size:12.5px;text-decoration:underline;cursor:pointer}.lk:hover{color:var(--bad)}
@media (max-width:900px){.tri{grid-template-columns:1fr;gap:8px}.tr{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;padding:12px 14px}.tr small{grid-column:1}.tr b{grid-column:2;grid-row:1/3;font-size:26px;margin:0}.tr span{grid-column:1;font-size:12px}.fat{grid-template-columns:minmax(0,1fr) auto}.fat .qd{text-align:left}.fat .btn{grid-column:1/-1}.exp{flex-wrap:wrap}.exp .mes{flex:1 1 100%}.exp .btn{flex:1 1 0}.pg .pag input{flex:1 1 100%}.pg .pag .anx,.pg .pag .btn{flex:1 1 0}}
.sec{margin:34px 0 12px;color:var(--mut);font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.st{padding:14px 16px;background:var(--p1);border:1px solid var(--ln)}
.st b{display:block;font-size:34px;line-height:1}
.st span{display:block;margin-top:4px;color:var(--mut);font-size:12.5px;font-weight:600}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--ln2);margin-left:6px}
.tl li{position:relative;padding:8px 0 12px 20px;font-size:14px}
.tl li::before{content:"";position:absolute;left:-7px;top:13px;width:10px;height:10px;background:var(--bg);border:2px solid var(--c);transform:rotate(45deg)}
.tl li small{display:block;color:var(--mut);font-size:12.5px}

/* indicações */
.busca{position:relative;flex:1;min-width:220px;max-width:420px}
.busca input{width:100%;height:46px;padding:0 14px 0 42px;border:1px solid var(--ln2);background:var(--p1);outline:none}
.busca input:focus{border-color:var(--c)}
.busca svg{position:absolute;left:14px;top:13px;color:var(--mut)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px;padding-bottom:2px}
.tabs button{flex:none;display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border:1px solid var(--ln2);background:var(--p1);color:var(--sil);font-weight:700;font-size:14px}
.tabs button i{font-style:normal;min-width:22px;padding:1px 6px;background:#1A262C;color:var(--sil);font-size:12px;text-align:center}
.tabs button[aria-selected=true]{border-color:var(--c);color:#fff;background:rgba(25,247,255,.08)}
.tabs button[aria-selected=true] i{background:var(--c);color:#050607}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.ci{display:flex;flex-direction:column;gap:10px;padding:16px;background:linear-gradient(160deg,var(--p2),var(--p1));border:1px solid var(--ln);animation:entra .3s ease both}
@keyframes entra{from{opacity:0;transform:translateY(6px)}}
.ci .l1{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ci .nm{font-size:17px;font-weight:800;line-height:1.2}
.idade{flex:none;padding:3px 8px;background:#15222A;color:var(--sil);font-size:12px;font-weight:700}
.idade.velha{background:rgba(255,200,87,.15);color:var(--warn)}
.ci .tel{display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none;font-weight:700}
.ci .tel svg{color:var(--ok)}
.ci .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--mut);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;background:#14232A;color:var(--c2);font-size:12.5px;font-weight:700}
.chip.app{background:rgba(50,224,0,.14);color:#7CFF5A}
.chip.pl{background:#1A2026;color:var(--sil)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;font-size:12.5px;font-weight:800}
.pill::before{content:"";width:7px;height:7px;background:currentColor;transform:rotate(45deg)}
.p-Nova{color:var(--c2);background:rgba(174,252,255,.1)}.p-Em{color:#7FD8FF;background:rgba(127,216,255,.1)}.p-Agendado{color:var(--warn);background:rgba(255,200,87,.12)}
/* funil (kanban) */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(222px,1fr);gap:10px;overflow-x:auto;padding-bottom:10px;align-items:start}
.kc{display:flex;flex-direction:column;gap:10px;padding:10px;background:rgba(255,255,255,.02);border:1px solid var(--ln);min-height:160px}
.kc>h3{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 4px 2px;font-size:14px;font-weight:800;letter-spacing:.3px;color:var(--k,var(--sil))}
.kc>h3 i{font-style:normal;min-width:24px;padding:1px 7px;background:var(--k,#1A262C);color:#050607;font-size:12px;text-align:center}
.kc>p.dica{margin:-4px 4px 2px;color:var(--mut);font-size:12.5px;line-height:1.35}
.kc .ci{padding:13px}.kc .ci .nm{font-size:15.5px}.kc .vz{color:var(--mut);font-size:13px;padding:14px 6px;text-align:center}
.ci .acoes .btn.sq{flex:none;width:42px;padding:0}
.kc .ci .chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;white-space:normal;text-align:left}.kc .ci .chip .cod{white-space:nowrap}
.kc .ci .acoes{flex-wrap:wrap}.kc .ci .acoes [data-av],.kc .ci .acoes [data-inst],.kc .ci .acoes [data-fat]{flex:1 1 100%;order:-1}
.pr .alerta7{display:inline-block;margin-top:4px;padding:2px 8px;font-size:12px;font-weight:800;color:#FFB86B;background:rgba(255,159,67,.12)}
.parados{display:flex;flex-direction:column;gap:8px}.parados .pd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:var(--p1);border:1px solid var(--ln);border-left:0}
.parados .pd b{display:block;font-size:15px}.parados .pd small{color:var(--mut);font-size:13px}
.p-Instalado,.p-ativo{color:var(--ok);background:rgba(77,240,160,.12)}.p-Não,.p-Cancelado,.p-bloqueado,.p-desfiliado,.p-recusado{color:var(--bad);background:rgba(255,107,129,.12)}.p-pendente{color:var(--warn);background:rgba(255,200,87,.12)}
.ci .acoes{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.ci .acoes .btn{flex:1}
.vazio{padding:40px 20px;text-align:center;color:var(--mut);background:var(--p1);border:1px dashed var(--ln2)}
.vazio b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

/* parceiros */
.pend{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:24px}
.pc{display:flex;flex-direction:column;gap:8px;padding:16px;background:linear-gradient(150deg,rgba(255,200,87,.1),var(--p1) 60%);border:1px solid rgba(255,200,87,.35)}
.pc .nm{font-weight:800;font-size:17px}
.pc .meta{color:var(--mut);font-size:13px;line-height:1.5}
.pc .acoes{display:flex;gap:8px;margin-top:6px}
.lista{display:grid;gap:8px}
.pr{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:12px 14px;background:var(--p1);border:1px solid var(--ln);text-align:left}
.pr:hover{border-color:var(--ln2);background:var(--p2)}
.pr .av{width:44px;height:44px}
.pr .nm{font-weight:800;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .sub{color:var(--mut);font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .dir{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.pr .nums{color:var(--mut);font-size:12px;font-weight:700;white-space:nowrap}
.pr .nums b{color:var(--ink)}
.cod{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;color:var(--c2);font-size:13px}
.flt{display:flex;gap:6px;flex-wrap:wrap}

/* pagar */
.pagtop{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.pagtop b{font-size:20px;min-width:0;flex:1;text-align:center}
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:22px;background:linear-gradient(125deg,#0E2328,#091317 60%);border:1px solid rgba(25,247,255,.25);margin-bottom:16px}
.hero small{display:block;color:var(--c2);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.hero .v{display:block;font-size:clamp(42px,8vw,60px);line-height:.9;color:var(--c);text-shadow:0 0 24px rgba(25,247,255,.3)}
.hero p{margin:6px 0 0;color:var(--sil);font-weight:600}
.hero .dt{text-align:center;padding-left:18px;border-left:2px dashed rgba(174,252,255,.3)}
.hero .dt b{display:block;font-size:50px;line-height:.85}
.hero .dt span{color:var(--sil);font-weight:800;letter-spacing:.06em}
.bar{height:6px;margin-top:12px;background:#152227}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--c))}
.pg{display:grid;grid-template-columns:minmax(0,1.2fr) auto minmax(0,1.4fr) auto;align-items:center;gap:14px;padding:14px 16px;background:var(--p1);border:1px solid var(--ln);margin-bottom:8px}
.pg .nm{font-weight:800}
.pg .sub{color:var(--mut);font-size:12.5px;font-weight:600}
.pg .val{font-size:28px;line-height:1}
.pix{display:flex;align-items:center;gap:8px;min-width:0;padding:8px 10px;background:#0E161A;border:1px solid var(--ln2)}
.pix span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;font-weight:600}
.pix button{flex:none;border:0;background:#15262D;color:var(--c);font-size:12.5px;font-weight:800;padding:5px 9px}
.pg .pag{display:flex;gap:8px}

 const tel = semCod.match(/(?:\+?55[\s.-]?)?\(?([1-9]\d)\)?[\s.-]?(9?\d{4})[\s.-]?(\d{4})/); if (tel) out.tel = `(${tel[1]}) ${tel[2]}-${tel[3]}`;

 if (nome && !/\d{4}/.test(nome) && !/^\+?\d/.test(nome.trim())) out.nome = nome.trim();
 const cpf = semCod.match(/\b(\d{3}\.?\d{3}\.?\d{3}-?\d{2})\b/); if (cpf && cpf[1].replace(/\D/g, '').length === 11 && (!tel || !cpf[1].includes(tel[3]))) out.cpf = cpf[1];

 return out;
};

 const f = e.target.closest('[data-arq]');
 if (f) { const lb = f.closest('.anx'), arq = f.files[0]; if (arq && arq.size > 5 * 1024 * 1024) { f.value = ''; return toast('Arquivo maior que 5 MB.', true); } lb.classList.toggle('tem', !!arq); lb.querySelector('span').textContent = arq ? arq.name : 'Comprovante'; return; }
 const ax = e.target.closest('[data-anexar]');
 if (ax && ax.files[0]) {
  if (ax.files[0].size > 5 * 1024 * 1024) { ax.value = ''; return toast('Arquivo maior que 5 MB.', true); }
  const fd = new FormData(); fd.append('id', ax.dataset.anexar); fd.append('arquivo', ax.files[0]);
  const r = await api('anexar', fd); if (r.erro) return toast(r.erro, true); toast(r.msg); TELAS.pagar();
 }
});
/* planilhas para a contabilidade (abrem no Excel) */
const csvDemo = (nome, cab, linhas) => {
 const q = v => { v = String(v ?? ''); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
 const txt = '﻿' + [cab, ...linhas].map(l => l.map(q).join(';')).join('\r\n');
 const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type:'text/csv;charset=utf-8' })); a.download = `hunter-league-${nome}.csv`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
};
document.addEventListener('click', async e => {
 const b = e.target.closest('[data-exp]'); if (!b) return;
 const t = b.dataset.exp, comp = t === 'indicacoes' ? '' : expMes;
 if (!DEMO) { location.href = `exportar.php?t=${t}${comp ? '&c=' + comp : ''}`; toast('Baixando a planilha…'); return; }
 if (t === 'indicacoes') { const r = await api('indicacoes'); csvDemo('indicacoes', ['Criada em', 'Cliente', 'Telefone', 'CPF do cliente', 'Plano', 'Etapa', 'Motivo', 'Instalada em', 'Bônus (R$)', 'Código do parceiro', 'Parceiro'], r.itens.map(i => [i.criado, i.nome, i.tel, i.cpf, i.plano, i.status, i.motivo, i.inst, i.bonus != null ? i.bonus.toFixed(2).replace('.', ',') : '', i.parceiro.codigo, i.parceiro.nome])); }
 else if (t === 'pagamentos') { const r = cache.bon || await api('bonus'); csvDemo(`bonus-pagos-${comp}`, ['Pago em', 'Código', 'Parceiro', 'Chave PIX', 'Clientes', 'Bônus (R$)', 'ID do PIX'], r.pagos.map(g => [g.pago_em, g.codigo, g.parceiro, g.pix, g.n, g.valor.toFixed(2).replace('.', ','), g.pix_id])); }
 else { const r = cache.bon || await api('bonus'); csvDemo(`instalacoes-${comp}`, ['Cliente', 'Código', 'Parceiro', 'Instalada em', 'Bônus (R$)', 'Situação'], [...r.faturas.map(x => [x.cliente, x.codigo, x.parceiro, x.inst, x.v.toFixed(2).replace('.', ','), 'Aguardando 1ª fatura']), ...r.liberados.map(x => [x.cliente, x.codigo, x.parceiro, x.inst, x.v.toFixed(2).replace('.', ','), 'Liberado'])]); }
 toast('Planilha baixada (dados de exemplo)');
});

/* ---------- tela: mais (configurações, equipe, histórico, minha senha) ---------- */
let maisAba = 'config';
TELAS.mais = async () => {
 const r = cache.cfg = await api('config'); const c = r.config;
 const abas = r.master ? [['config', 'Configurações'], ['email', 'E-mail'], ['equipe', 'Equipe'], ['hist', 'Histórico'], ['senha', 'Minha senha']] : [['senha', 'Minha senha']];
 if (!abas.find(x => x[0] === maisAba)) maisAba = abas[0][0];
 $('#main').innerHTML = `<div class="hd"><div><h1 class="bs">Mais</h1><p>${r.master ? 'Ajustes do programa e da equipe.' : 'Sua conta na Central.'}</p></div><button class="btn g" type="button" data-sair>Sair</button></div>
  <div class="tabs">${abas.map(([k, t]) => `<button type="button" data-ma="${k}" aria-selected="${maisAba === k}">${t}</button>`).join('')}</div><div id="mais-c"></div>`;
 const box = $('#mais-c');
 if (maisAba === 'config') {
  const dis = r.master ? '' : ' disabled';
  box.innerHTML = `<form class="form ch" id="f-cfg">
   <p class="sub" style="margin:0 0 4px">Bônus por instalação: o valor do plano vendido (100% da mensalidade), liberado após a 1ª fatura paga.</p>
   <div class="g3">${PLANOS.map((p, k) => `<label class="f">${h(p)} (R$)<input name="bonus_pl_${k}" inputmode="decimal" value="${h(String(c.bonus_planos || '55|70|85|100').split('|')[k] || '')}"${dis}></label>`).join('')}</div>
   <label class="f">Prazo para pagar o saque (aparece no app)<input name="prazo_saque" value="${h(c.prazo_saque)}"${dis}></label>
   <label class="f">WhatsApp que recebe as indicações<input name="whatsapp" value="${h(c.whatsapp)}"${dis}><small>55 + DDD + número</small></label>
   <label class="f">Mensagem que o cliente manda<input name="mensagem_wa" value="${h(c.mensagem_wa)}"${dis}><small>Precisa ter {codigo}</small></label>
   <div class="g2"><label class="f">Cidades do cadastro<input name="cidades" value="${h(c.cidades)}"${dis}><small>"todas" = as 323 cidades com fibra. Ou uma lista: Araguari, Uberlândia</small></label><label class="f">Preço promocional extra<input name="cidades_promo" value="${h(c.cidades_promo)}"${dis}><small>A tabela promocional já vem da base de cidades. Use só para incluir outras.</small></label></div>
   <label class="f">Metas: instalações validadas | prêmio (uma por linha)<textarea name="metas"${dis}>${h(c.metas)}</textarea><small>Conta instalação com a 1ª fatura paga. Ex.: 20|Air Fryer</small></label>
   <fieldset class="f kitf"><legend>Kit do Estabelecimento</legend><label class="ck"><input type="checkbox" name="kit_ativo" value="1"${c.kit_ativo === '0' ? '' : ' checked'}${dis}> Liberar o kit na 1ª instalação do parceiro</label><label class="f">Nome do kit<input name="kit_nome" value="${h(c.kit_nome || 'Kit do Estabelecimento')}"${dis}></label><label class="f">O que vem no kit (aparece no app)<input name="kit_itens" value="${h(c.kit_itens ?? 'Adesivos, QR Code para o balcão e panfletos')}"${dis}><small>Ex.: Adesivos, QR Code para o balcão e panfletos. Libera na 1ª instalação, sem esperar a 1ª fatura.</small></label></fieldset>
   <label class="f">Validade da indicação (dias)<input name="validade_dias" type="number" min="15" max="365" value="${h(c.validade_dias || 60)}"${dis}><small>Sem instalação nesse prazo, o cliente pode ser indicado de novo. Cliente instalado nunca é indicado de novo.</small></label>
   <label class="f">Pixel da Meta (opcional)<input name="pixel_meta" value="${h(c.pixel_meta)}"${dis}></label>
   ${r.master ? '<button class="btn" type="submit" style="justify-self:start">Salvar configurações</button>' : '<p class="sub">Só o master muda as configurações.</p>'}</form>`;
  if (r.master) $('#f-cfg').addEventListener('submit', async e => { e.preventDefault(); const v = Object.fromEntries(new FormData(e.target)); const rr = await api('salvar_config', v); rr.erro ? toast(rr.erro, true) : toast(rr.msg); });
 }
 if (maisAba === 'equipe') {
  box.innerHTML = `<div class="lista">${r.equipe.map(u => `<div class="pr ch" style="cursor:default"><span class="av">${h(iniciais(u.nome))}</span><span><span class="nm" style="display:block">${h(u.nome)}${u.eu ? ' (você)' : ''}</span><span class="sub" style="display:block">${h(u.usuario)} · ${u.papel === 'master' ? 'Master' : 'Atendimento'}</span></span><span class="dir">${u.eu ? '' : `<button class="btn sm ${u.ativo ? 'g' : ''}" type="button" data-ut="${u.id}">${u.ativo ? 'Desativar' : 'Ativar'}</button>`}${u.ativo ? '' : '<span class="pill p-bloqueado">inativo</span>'}</span></div>`).join('')}</div>
   <p class="sec">Novo usuário</p><form class="form ch" id="f-eq"><div class="g2"><label class="f">Nome<input name="nome" required></label><label class="f">Usuário<input name="usuario" required pattern="[a-z0-9._\\-]{3,40}"></label><label class="f">Senha (10 ou mais)<input name="senha" type="password" minlength="10" required></label><label class="f">Papel<select name="papel"><option value="atendimento">Atendimento (registra e avança)</option><option value="master">Master (tudo)</option></select></label></div><button class="btn" type="submit" style="justify-self:start">Criar usuário</button></form>`;
  $('#f-eq').addEventListener('submit', async e => { e.preventDefault(); const v = Object.assign({ o:'criar' }, Object.fromEntries(new FormData(e.target))); const rr = await api('equipe', v); if (rr.erro) return toast(rr.erro, true); toast(rr.msg); TELAS.mais(); });
 }
 if (maisAba === 'email') {
  box.innerHTML = `<form class="form ch" id="f-mail" style="max-width:620px">
   <p class="sub" style="margin:0">Usado no "Esqueci a senha" do app: o parceiro recebe um link no e-mail do cadastro. Use uma conta Zoho do domínio (ex.: nao-responda@callnetbrasil.com.br). No Zoho, gere uma <b>senha de aplicativo</b> e cole abaixo.</p>
   <div class="g2"><label class="f">Servidor<input name="smtp_host" value="${h(c.smtp_host || 'smtp.zoho.com')}"></label><label class="f">Porta<input name="smtp_porta" inputmode="numeric" value="${h(c.smtp_porta || '465')}"></label></div>
   <label class="f">E-mail (usuário)<input name="smtp_usuario" type="email" value="${h(c.smtp_usuario || '')}" placeholder="nao-responda@callnetbrasil.com.br"></label>
   <label class="f">Senha de aplicativo<input name="smtp_senha" type="password" autocomplete="new-password" placeholder="${c.smtp_tem_senha ? '•••••••• salva (deixe vazio para manter)' : 'cole a senha aqui'}"></label>
   <label class="f">Nome que aparece no e-mail<input name="smtp_nome" value="${h(c.smtp_nome || 'Hunter League · CallNet')}"></label>
   <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" type="submit">Salvar</button><button class="btn g" type="button" id="m-teste">Enviar teste</button></div>
   <p class="sub" style="margin:0">${c.smtp_tem_senha && c.smtp_usuario ? '✓ Recuperação por e-mail ativa.' : 'Enquanto não estiver configurado, o "Esqueci a senha" manda o parceiro para o WhatsApp.'}</p></form>`;
  $('#f-mail').addEventListener('submit', async e => { e.preventDefault(); const rr = await api('email', Object.fromEntries(new FormData(e.target))); rr.erro ? toast(rr.erro, true) : (toast(rr.msg), TELAS.mais()); });
  $('#m-teste').addEventListener('click', async () => { toast('Enviando…'); const rr = await api('email', { o:'teste' }); rr.erro ? toast(rr.erro, true) : toast(rr.msg); });
 }
 if (maisAba === 'hist') box.innerHTML = `<ul class="hist">${r.historico.map(x => `<li class="ch"><span>${h(x.em)}</span><span>${h(x.quem)}</span><div><b>${h(x.acao)}</b> ${h(x.alvo)}${x.detalhe ? ` <span>· ${h(x.detalhe)}</span>` : ''}</div></li>`).join('')}</ul>`;
 if (maisAba === 'senha') {
  box.innerHTML = `<form class="form ch" id="f-pw" style="max-width:440px"><label class="f">Senha atual<input name="atual" type="password" required></label><label class="f">Senha nova (10 ou mais)<input name="nova" type="password" minlength="10" required></label><button class="btn" type="submit" style="justify-self:start">Trocar senha</button></form>`;
  $('#f-pw').addEventListener('submit', async e => { e.preventDefault(); const rr = await api('minha_senha', Object.fromEntries(new FormData(e.target))); rr.erro ? toast(rr.erro, true) : (toast(rr.msg), e.target.reset()); });
 }
};
document.addEventListener('click', async e => {
 const a = e.target.closest('[data-ma]'); if (a) { maisAba = a.dataset.ma; return TELAS.mais(); }
 const u = e.target.closest('[data-ut]'); if (u) { const r = await api('equipe', { id:+u.dataset.ut }); r.erro ? toast(r.erro, true) : toast(r.msg); TELAS.mais(); }
});

/* ---------- começo ---------- */
$('#me-n').textContent = BOOT.nome; $('#me-p').textContent = BOOT.papel === 'master' ? 'Master' : 'Atendimento';
$('#me-av').textContent = $('#me-av2').textContent = iniciais(BOOT.nome);
const inicio = (location.hash || '#hoje').slice(1);
(async () => { await atualizaResumo(); ir(TELAS[inicio] ? inicio : 'hoje'); })();
if (DEMO) { document.body.classList.add('ehdemo'); $('#demo-bar').hidden = false; $('#demo-reset').addEventListener('click', e => { e.preventDefault(); DEMO_RESET(); cache = {}; ir('hoje'); toast('Demonstração recomeçada.'); }); }
}
</script>
</body>
