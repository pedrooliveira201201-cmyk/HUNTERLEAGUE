name: Limpar pasta duplicada (uso único)
on: workflow_dispatch
jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Remover public_html/public_html criada por engano no primeiro deploy
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          L="lftp -u $U,$P $S -e"
          OPT="set ftp:ssl-allow yes; set ssl:verify-certificate no;"
          RAIZ=$($L "$OPT cls -1a; bye")
          DUP=$($L "$OPT cls -1a public_html/; bye")
          echo "--- raiz ---"; echo "$RAIZ"; echo "--- duplicada ---"; echo "$DUP"
          # Segurança: a raiz precisa ter o config.php (site verdadeiro) e a duplicada não.
          echo "$RAIZ" | grep -qx 'config.php' || { echo "ABORTADO: raiz sem config.php"; exit 1; }
          echo "$DUP" | grep -q 'config.php' && { echo "ABORTADO: duplicada tem config.php"; exit 1; }
          echo "$DUP" | grep -q 'versao.txt' || { echo "ABORTADO: não parece a cópia do deploy"; exit 1; }
          $L "$OPT rm -r -f public_html; cls -1a; bye"
