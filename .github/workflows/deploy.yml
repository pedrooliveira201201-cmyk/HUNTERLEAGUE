name: Deploy para a Hostinger

# Publica no hunterleague.com.br sempre que a branch main recebe alterações.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar credenciais de FTP
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "Secrets de FTP ainda não configurados; deploy ignorado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - name: Enviar arquivos por FTP
        if: steps.check.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR || './' }}
          # Só envia/remove arquivos que vieram do repositório.
          # config.php, recrutamento-config.php e arquivos/ do servidor nunca são tocados.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
